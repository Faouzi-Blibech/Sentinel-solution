<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARIS trace viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%2312161d%27/%3E%3Crect x=%274%27 y=%274%27 width=%278%27 height=%278%27 rx=%271%27 fill=%27%234fb286%27/%3E%3C/svg%3E">
<style>
/* Fully offline: no web fonts. This stack resolves natively on the demo machine. */
:root {
  --ground: #12161d;
  --surface: #1a2029;
  --raised: #222a35;
  --rule: #2e3846;
  --rule-soft: #232b36;
  --ink: #e6eaf0;
  --ink-dim: #93a1b3;
  --ink-faint: #64748b;

  /* Decision: categorical, four outcomes. */
  --allow: #4fb286;
  --block: #e05260;
  --escalate: #e8a33d;
  --rewrite: #5b9dd9;

  /* Trust: ordinal, most to least trusted. Cool means settled, warm means foreign. */
  --t-system_policy: #5e7a8c;
  --t-authenticated_user: #6e8fa3;
  --t-trusted_internal: #8aa6b8;
  --t-untrusted_internal: #c2a15c;
  --t-untrusted_external: #cf7a3c;
  --t-adversary_controlled: #c2405f;

  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
:focus-visible { outline: 2px solid var(--rewrite); outline-offset: 2px; }

/* ---------- shell ---------- */

.shell {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr) 420px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
}

.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: baseline;
  gap: 24px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}

.wordmark {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.wordmark span { color: var(--ink-faint); font-weight: 400; margin-left: 10px; font-size: 14px; }

.run-title { font-family: var(--mono); font-size: 14px; color: var(--ink-dim); }

.verdicts { margin-left: auto; display: flex; gap: 10px; }

.verdict {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  font-size: 13px;
  color: var(--ink-dim);
  background: var(--raised);
}
.verdict b { color: var(--ink); font-weight: 500; }
.verdict.good { border-color: color-mix(in srgb, var(--allow) 55%, var(--rule)); }
.verdict.good b { color: var(--allow); }
.verdict.bad { border-color: color-mix(in srgb, var(--block) 55%, var(--rule)); }
.verdict.bad b { color: var(--block); }

/* ---------- rails ---------- */

.rail, .inspector { overflow-y: auto; background: var(--surface); }
.rail { border-right: 1px solid var(--rule); }
.inspector { border-left: 1px solid var(--rule); }

.rail-head, .insp-head {
  padding: 16px 18px 10px;
  font-size: 13px;
  color: var(--ink-faint);
  border-bottom: 1px solid var(--rule-soft);
}

.run-list { list-style: none; margin: 0; padding: 8px; }
.run-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border-radius: 4px;
  border-left: 3px solid transparent;
}
.run-item:hover { background: var(--raised); }
.run-item[aria-current="true"] { background: var(--raised); border-left-color: var(--rewrite); }
.run-item .name { font-size: 14px; }
.run-item .meta { font-size: 12px; color: var(--ink-faint); font-family: var(--mono); margin-top: 3px; }
.run-item .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; }
.run-item .dot.ok { background: var(--allow); }
.run-item .dot.no { background: var(--block); }
.run-item .dot.unknown { background: var(--ink-faint); }

/* ---------- spine ---------- */

.spine { overflow-y: auto; padding: 0 0 60px; }

.goal {
  margin: 0;
  padding: 18px 26px;
  border-bottom: 1px solid var(--rule-soft);
  color: var(--ink);
  max-width: 78ch;
}
.goal small { display: block; color: var(--ink-faint); font-size: 13px; margin-bottom: 6px; }

.steps { list-style: none; margin: 0; padding: 10px 0 0; }

.step {
  display: grid;
  grid-template-columns: 54px 14px minmax(0, 1fr);
  gap: 0 14px;
  padding: 0 26px;
  position: relative;
}

.step-btn {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 54px 14px minmax(0, 1fr) 120px;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 11px 0;
  border-top: 1px solid var(--rule-soft);
  text-align: left;
}
.step:first-child .step-btn { border-top: none; }
.step-btn:hover { background: color-mix(in srgb, var(--raised) 55%, transparent); }
.step[aria-selected="true"] .step-btn { background: var(--raised); }

.step-id { font-family: var(--mono); font-size: 13px; color: var(--ink-faint); }

.marker { width: 12px; height: 12px; border-radius: 2px; background: var(--ink-faint); }
.marker.allow { background: var(--allow); }
.marker.block { background: var(--block); }
.marker.escalate { background: var(--escalate); }
.marker.rewrite { background: var(--rewrite); }
.marker.none { background: transparent; border: 1px solid var(--rule); }

.step-label { min-width: 0; }
.step-label .what { font-size: 15px; }
.step-label .what b { font-weight: 600; }
.step-label .what .tool { font-family: var(--mono); color: var(--ink-dim); }
.step-label .why {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-faint);
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.micro { height: 5px; background: var(--rule-soft); border-radius: 3px; overflow: hidden; }
.micro i { display: block; height: 100%; border-radius: 3px; }

.decision-word.allow { color: var(--allow); }
.decision-word.block { color: var(--block); }
.decision-word.escalate { color: var(--escalate); }
.decision-word.rewrite { color: var(--rewrite); }

.step-body {
  grid-column: 3 / -1;
  padding: 0 0 14px;
  display: none;
}
.step[aria-selected="true"] .step-body { display: block; }

.evline {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink-dim);
  padding: 5px 0 5px 12px;
  border-left: 2px solid var(--rule);
  margin: 4px 0;
  white-space: pre-wrap;
  word-break: break-word;
  max-width: 92ch;
}
.evline.violation { border-left-color: var(--block); color: color-mix(in srgb, var(--block) 72%, var(--ink)); }
.evline .k { color: var(--ink-faint); }

/* Untrusted material is visually foreign, not merely a different colour. */
.evline.untrusted {
  border-left-color: var(--t-untrusted_external);
  background-image: repeating-linear-gradient(
    135deg, transparent 0 6px, color-mix(in srgb, var(--t-untrusted_external) 11%, transparent) 6px 12px);
}

/* ---------- inspector ---------- */

.insp-section { padding: 16px 18px; border-bottom: 1px solid var(--rule-soft); }
.insp-section h3 { margin: 0 0 12px; font-size: 13px; font-weight: 500; color: var(--ink-faint); }

.risk-head { display: flex; align-items: flex-end; gap: 16px; }
.risk-number { font-size: 46px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.risk-meta { font-size: 13px; color: var(--ink-dim); padding-bottom: 5px; }

.pill {
  display: inline-block;
  padding: 3px 11px;
  border-radius: 3px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}
.pill.allow { background: color-mix(in srgb, var(--allow) 20%, transparent); color: var(--allow); }
.pill.block { background: color-mix(in srgb, var(--block) 20%, transparent); color: var(--block); }
.pill.escalate { background: color-mix(in srgb, var(--escalate) 20%, transparent); color: var(--escalate); }
.pill.rewrite { background: color-mix(in srgb, var(--rewrite) 20%, transparent); color: var(--rewrite); }

.explain { margin: 12px 0 0; color: var(--ink-dim); font-size: 13.5px; max-width: 46ch; }

.signal { margin-bottom: 13px; }
.signal.inactive { opacity: 0.38; }
.signal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.signal-code { font-family: var(--mono); font-size: 12.5px; }
.signal-val { font-family: var(--mono); font-size: 12.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.signal-bar { height: 7px; background: var(--rule-soft); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.signal-bar i {
  display: block;
  height: 100%;
  background: var(--escalate);
  border-radius: 3px;
  transition: width 260ms ease-out;
}
.signal.fired .signal-bar i { background: var(--block); }
.signal-detail { font-size: 12px; color: var(--ink-faint); margin-top: 4px; font-family: var(--mono); word-break: break-word; }

@media (prefers-reduced-motion: reduce) {
  .signal-bar i { transition: none; }
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  border-radius: 3px;
  border: 1px solid var(--rule);
  background: var(--raised);
  font-size: 12.5px;
  margin: 0 6px 6px 0;
  font-family: var(--mono);
}
.chip .swatch { width: 9px; height: 9px; border-radius: 2px; }
.chip.foreign {
  background-image: repeating-linear-gradient(
    135deg, transparent 0 5px, color-mix(in srgb, currentColor 10%, transparent) 5px 10px);
}
.chip .lvl { color: var(--ink-dim); }

/* Vertical: a 420px column cannot hold source, break and sink side by side. */
.flow { font-family: var(--mono); font-size: 12.5px; }
.flow .node {
  padding: 8px 11px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--raised);
  word-break: break-all;
}
.flow .node .role { display: block; font-family: var(--sans); font-size: 11.5px; color: var(--ink-faint); margin-bottom: 3px; }
.flow .node.secret { border-color: color-mix(in srgb, var(--escalate) 60%, var(--rule)); }
.flow .node.sink { border-color: color-mix(in srgb, var(--block) 60%, var(--rule)); }
.flow .link { display: flex; align-items: center; gap: 10px; padding: 7px 0 7px 16px; }
.flow .link .rail { width: 2px; align-self: stretch; background: var(--rule); border-radius: 2px; }
.flow .link.severed .rail { background: repeating-linear-gradient(180deg, var(--block) 0 4px, transparent 4px 8px); }
.flow .stop {
  color: var(--block);
  font-family: var(--sans);
  font-weight: 600;
  font-size: 12px;
  padding: 2px 9px;
  border: 1px solid var(--block);
  border-radius: 3px;
}
.flow .link .carried { color: var(--ink-faint); font-size: 12px; }
.flow-note { margin-top: 10px; font-size: 12.5px; color: var(--ink-faint); }

.empty { color: var(--ink-faint); font-size: 13.5px; }

kbd {
  font-family: var(--mono);
  font-size: 11.5px;
  border: 1px solid var(--rule);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--ink-dim);
}
.hint { padding: 12px 18px; color: var(--ink-faint); font-size: 12.5px; }

@media (max-width: 1280px) {
  .shell { grid-template-columns: 220px minmax(0, 1fr) 340px; }
  .risk-number { font-size: 38px; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="wordmark">HARIS<span>trace viewer</span></div>
    <div class="run-title" id="run-title">no run loaded</div>
    <div class="verdicts" id="verdicts"></div>
  </header>

  <nav class="rail">
    <div class="rail-head">Runs</div>
    <ul class="run-list" id="run-list"></ul>
    <p class="hint">Move with <kbd>J</kbd> <kbd>K</kbd>. Jump to the first intervention with <kbd>B</kbd>.</p>
  </nav>

  <main class="spine" id="spine">
    <p class="goal" id="goal"><small>Task</small>Pick a run to begin.</p>
    <ul class="steps" id="steps"></ul>
  </main>

  <aside class="inspector" id="inspector">
    <div class="insp-head">Decision</div>
    <div class="insp-section"><p class="empty">Select a step to see why it was decided that way.</p></div>
  </aside>
</div>

<script>
const TRUST_ORDER = ["system_policy", "authenticated_user", "trusted_internal",
                     "untrusted_internal", "untrusted_external", "adversary_controlled"];
const TRUSTED = new Set(["system_policy", "authenticated_user", "trusted_internal"]);

const state = { runs: [], view: null, selected: null };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const trustColor = (lvl) => `var(--t-${TRUST_ORDER.includes(lvl) ? lvl : "trusted_internal"})`;

/* ---------- loading ---------- */

async function loadRuns() {
  const data = await (await fetch("/api/runs")).json();
  state.runs = data.runs || [];
  const list = $("run-list");
  if (!state.runs.length) {
    list.innerHTML = `<li class="hint">No run artifacts under ${esc(data.root || "artifacts")}.
      Run a scenario first, then reload.</li>`;
    return;
  }
  list.innerHTML = state.runs.map((r, i) => {
    const ok = r.outcome?.task_success;
    const cls = ok === true ? "ok" : ok === false ? "no" : "unknown";
    return `<li><button class="run-item" data-i="${i}">
      <div class="name"><span class="dot ${cls}"></span>${esc(r.scenario)}</div>
      <div class="meta">${r.steps} steps</div>
    </button></li>`;
  }).join("");
  list.querySelectorAll(".run-item").forEach(btn =>
    btn.addEventListener("click", () => selectRun(Number(btn.dataset.i))));
  selectRun(0);
}

async function selectRun(index) {
  const run = state.runs[index];
  if (!run) return;
  document.querySelectorAll(".run-item").forEach((b, i) =>
    b.setAttribute("aria-current", String(i === index)));
  state.view = await (await fetch("/api/run?path=" + encodeURIComponent(run.id))).json();
  renderRun();
}

/* ---------- run ---------- */

function renderRun() {
  const v = state.view;
  $("run-title").textContent = v.run_id || v.scenario;
  $("goal").innerHTML = `<small>Task</small>${esc(v.goal || "No task recorded.")}`;
  renderVerdicts(v);
  renderSteps(v);

  // Open on the most informative step: the first intervention, else the first real decision.
  const decided = v.steps.filter(s => s.decision);
  const target = decided.find(s => s.decision.decision !== "allow") || decided[0] || v.steps[0];
  select(target ? target.step_id : undefined);
}

function renderVerdicts(v) {
  const blocked = (v.counts.block || 0) + (v.counts.escalate || 0) + (v.counts.rewrite || 0);
  const ok = v.outcome?.task_success;
  const items = [
    { label: "Task", value: ok === true ? "completed" : ok === false ? "failed" : "unknown",
      cls: ok === true ? "good" : ok === false ? "bad" : "" },
    { label: "Interventions", value: String(blocked), cls: "" },
    { label: "Allowed", value: String(v.counts.allow || 0), cls: "" },
  ];
  if (!v.has_reasoning) items.push({ label: "Reasoning", value: "journal missing", cls: "" });
  $("verdicts").innerHTML = items.map(i =>
    `<div class="verdict ${i.cls}">${esc(i.label)} <b>${esc(i.value)}</b></div>`).join("");
}

function stepSummary(step) {
  const d = step.decision;
  const action = d?.action || step.journal?.action;
  const kind = action?.type === "tool_call" ? action.tool : action?.type;
  if (!d) {
    const ev = step.events.find(e => e.type === "user_message") ? "task received"
             : step.events.map(e => e.type).join(", ");
    return { word: "", tool: ev, risk: null };
  }
  return { word: d.decision, tool: kind || "", risk: d.risk_score };
}

function renderSteps(v) {
  $("steps").innerHTML = v.steps.map(step => {
    const s = stepSummary(step);
    const codes = (step.decision?.reason_codes || []).join("  ");
    const pct = s.risk === null ? 0 : Math.round(s.risk * 100);
    const color = s.word ? `var(--${s.word})` : "var(--ink-faint)";
    return `<li class="step" data-step="${step.step_id}" aria-selected="false">
      <button class="step-btn">
        <span class="step-id">step ${step.step_id}</span>
        <span class="marker ${s.word || "none"}"></span>
        <span class="step-label">
          <span class="what">${s.word
            ? `<b class="decision-word ${s.word}">${esc(s.word)}</b> <span class="tool">${esc(s.tool)}</span>`
            : `<span class="tool">${esc(s.tool)}</span>`}</span>
          ${codes ? `<span class="why">${esc(codes)}</span>` : ""}
        </span>
        <span class="micro" title="${s.risk === null ? "" : "risk " + s.risk}">
          <i style="width:${pct}%;background:${color}"></i></span>
      </button>
      <div class="step-body">${renderEvents(step)}</div>
    </li>`;
  }).join("");

  document.querySelectorAll(".step .step-btn").forEach(btn =>
    btn.addEventListener("click", () =>
      select(Number(btn.closest(".step").dataset.step))));
}

function trustOf(step, refs) {
  const prov = state.view.provenance || {};
  let worst = null;
  (refs || []).forEach(id => {
    const lvl = prov[id]?.trust_level;
    if (!lvl) return;
    if (worst === null || TRUST_ORDER.indexOf(lvl) > TRUST_ORDER.indexOf(worst)) worst = lvl;
  });
  return worst;
}

function renderEvents(step) {
  return step.events.map(ev => {
    const p = ev.payload || {};
    const lvl = trustOf(step, ev.provenance_refs);
    const foreign = lvl && !TRUSTED.has(lvl) ? " untrusted" : "";
    let text;
    switch (ev.type) {
      case "user_message": text = p.text; break;
      case "tool_request": text = `${p.tool}(${JSON.stringify(p.arguments || {})})`; break;
      case "retrieval_result":
      case "tool_result":
        text = `${p.tool} ${p.succeeded ? "ok" : "error"} ${JSON.stringify(p.result ?? p.error ?? "")}`;
        break;
      case "policy_violation": text = `${p.rule || "violation"}: ${p.detail || JSON.stringify(p)}`; break;
      case "model_output": text = p.content; break;
      case "defense_decision": return "";
      default: text = JSON.stringify(p);
    }
    const cls = ev.type === "policy_violation" ? " violation" : foreign;
    const tag = lvl ? ` <span class="k">[${lvl}]</span>` : "";
    return `<div class="evline${cls}"><span class="k">${esc(ev.type)}</span>${tag}
      ${esc(String(text || "").slice(0, 600))}</div>`;
  }).join("");
}

/* ---------- inspector ---------- */

function select(stepId) {
  if (stepId === undefined || stepId === null) return;
  state.selected = stepId;
  document.querySelectorAll(".step").forEach(el =>
    el.setAttribute("aria-selected", String(Number(el.dataset.step) === stepId)));
  const el = document.querySelector(`.step[data-step="${stepId}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
  renderInspector(state.view.steps.find(s => s.step_id === stepId));
}

function renderInspector(step) {
  const insp = $("inspector");
  if (!step || !step.decision) {
    insp.innerHTML = `<div class="insp-head">Decision</div>
      <div class="insp-section"><p class="empty">No defense decision at this step.</p></div>`;
    return;
  }
  const d = step.decision;
  insp.innerHTML = `
    <div class="insp-head">Decision</div>
    ${sectionVerdict(d)}
    ${sectionSignals(step)}
    ${sectionTrust(step)}
    ${sectionFlow(step)}`;

  requestAnimationFrame(() => insp.querySelectorAll(".signal-bar i")
    .forEach(bar => { bar.style.width = bar.dataset.w + "%"; }));
}

function sectionVerdict(d) {
  const rewritten = d.rewritten_action
    ? `<p class="explain">Substituted <span class="signal-code">${esc(d.rewritten_action.tool || d.rewritten_action.type)}</span>.</p>`
    : "";
  return `<div class="insp-section">
    <div><span class="pill ${d.decision}">${esc(d.decision)}</span></div>
    <div class="risk-head">
      <div class="risk-number" style="color:var(--${d.decision})">${Number(d.risk_score).toFixed(2)}</div>
      <div class="risk-meta">risk<br>confidence ${Number(d.confidence).toFixed(2)}</div>
    </div>
    <p class="explain">${esc(d.explanation || "")}</p>
    ${rewritten}
  </div>`;
}

function sectionSignals(step) {
  if (!step.signals || !step.signals.length) {
    return `<div class="insp-section"><h3>Signals</h3>
      <p class="empty">No journal entry for this step, so the score cannot be decomposed.
      Run with the HARIS service to record reasoning.</p></div>`;
  }
  const ordered = [...step.signals].sort((a, b) => b.contribution - a.contribution);
  return `<div class="insp-section"><h3>Signals</h3>${ordered.map(s => {
    const fired = s.value > 0;
    return `<div class="signal ${fired ? "fired" : "inactive"}">
      <div class="signal-top">
        <span class="signal-code">${esc(s.code)}</span>
        <span class="signal-val">${Number(s.contribution).toFixed(2)}</span>
      </div>
      <div class="signal-bar"><i data-w="${Math.round(Math.min(1, s.contribution) * 100)}" style="width:0"></i></div>
      ${s.detail ? `<div class="signal-detail">${esc(s.detail)}</div>` : ""}
    </div>`;
  }).join("")}</div>`;
}

function sectionTrust(step) {
  const records = step.journal?.provenance || [];
  if (!records.length) {
    return `<div class="insp-section"><h3>Trust chain</h3>
      <p class="empty">No provenance recorded at this step.</p></div>`;
  }
  const sorted = [...records].sort((a, b) =>
    TRUST_ORDER.indexOf(b.trust_level) - TRUST_ORDER.indexOf(a.trust_level));
  return `<div class="insp-section"><h3>Trust chain</h3>${sorted.map(r => {
    const foreign = !TRUSTED.has(r.trust_level);
    return `<span class="chip ${foreign ? "foreign" : ""}" style="color:${trustColor(r.trust_level)}">
      <span class="swatch" style="background:${trustColor(r.trust_level)}"></span>
      <span style="color:var(--ink)">${esc(r.source_id || r.id)}</span>
      <span class="lvl">${esc(r.trust_level)}</span>
    </span>`;
  }).join("")}
  <p class="flow-note">Hatched sources cannot authorize an action. They are evidence, not instructions.</p>
  </div>`;
}

function sectionFlow(step) {
  const f = step.dataflow || {};
  if (!f.destination_class) {
    return `<div class="insp-section"><h3>Data flow</h3>
      <p class="empty">No outbound payload at this step.</p></div>`;
  }
  const leaked = f.encoding && f.encoding !== "none";
  const external = f.destination_class === "external";
  const stopped = leaked && external;
  const dest = (f.destinations && f.destinations[0]) || f.destination_class;
  const watched = f.tainted_value_count
    ? `${f.tainted_value_count} value${f.tainted_value_count === 1 ? "" : "s"} under watch`
    : "nothing under watch";
  return `<div class="insp-section"><h3>Data flow</h3>
    <div class="flow">
      <div class="node ${leaked ? "secret" : ""}">
        <span class="role">${leaked ? "sensitive value" : "payload"}</span>
        ${leaked ? esc(f.tainted_hit || "matched a watched value") : "no sensitive value present"}
      </div>
      <div class="link ${stopped ? "severed" : ""}">
        <span class="rail"></span>
        ${stopped ? `<span class="stop">stopped here</span>` : ""}
        <span class="carried">${leaked ? `carried as ${esc(f.encoding)}` : "nothing to carry"}</span>
      </div>
      <div class="node ${external ? "sink" : ""}">
        <span class="role">${external ? "external destination" : "destination"}</span>
        ${esc(dest)}
      </div>
    </div>
    <p class="flow-note">${esc(watched)}</p>
  </div>`;
}

/* ---------- keyboard: a demo should not depend on steady mouse work ---------- */

document.addEventListener("keydown", (e) => {
  if (!state.view) return;
  const ids = state.view.steps.map(s => s.step_id);
  const at = ids.indexOf(state.selected);
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); select(ids[Math.min(ids.length - 1, at + 1)]); }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); select(ids[Math.max(0, at - 1)]); }
  if (e.key === "b") {
    const hit = state.view.steps.find(s => s.decision && s.decision.decision !== "allow");
    if (hit) select(hit.step_id);
  }
});

loadRuns();
</script>
</body>
</html>
