/* ---------- run-level labels ---------- */

const isHaris = (defense) => /^(http_defense|haris)\b/i.test(defense || "");
function defenseLabel(defense) {
  if (!defense) return "unknown defense";
  if (defense === "http_defense") return "HARIS";
  return defense.replace(/^haris\b/i, "HARIS");
}
function kindOf(summary) {
  if (!summary) return null;
  if (summary.attack_present) return "attack";
  if (summary.hard_negative) return "hard_negative";
  return "benign";
}

/* ---------- step-level helpers ---------- */

const stepById = (id) => state.view?.steps.find(s => s.step_id === id);
function decisionOf(step) {
  const d = step?.decision?.decision;
  return DECISIONS.includes(d) ? d : null;
}
const actionOf = (step) => step?.decision?.action || step?.journal?.action || null;
const rewrittenOf = (step) => step?.decision?.rewritten_action || step?.journal?.rewritten_action || null;
function actionName(a) {
  if (!a) return "";
  if (a.type === "tool_call") return a.tool || "tool_call";
  if (a.type === "request_confirmation") return `confirm ${a.confirmation_for?.tool || a.confirmation_for?.type || "action"}`;
  return a.type || "";
}
function stepLabel(step) {
  const d = decisionOf(step);
  if (d) return { word: d.toUpperCase(), name: actionName(actionOf(step)) };
  const types = step.events.map(e => e.type);
  if (types.includes("user_message")) return { word: "TASK", name: "task received" };
  return { word: "EVENT", name: [...new Set(types)].join(", ").replaceAll("_", " ") };
}
const codesOf = (step) => (step.decision?.reason_codes || []).filter(c => c !== "GOAL_ALIGNED");

function sourceLabel(rec) {
  if (!rec) return "";
  if (rec.source_type === "user") return "user goal";
  const type = String(rec.source_type || "").replaceAll("_", " ");
  return type ? `${type} ${rec.source_id || rec.id}` : String(rec.source_id || rec.id);
}

/** The least trusted of a set of provenance ids, with a label naming where it came from. */
function worstOf(ids) {
  const prov = state.view?.provenance || {};
  let level = null, recs = [];
  for (const id of ids || []) {
    const rec = prov[id];
    const l = rec?.trust_level;
    if (!l) continue;
    if (level === null || trustRank(l) > trustRank(level)) { level = l; recs = [rec]; }
    else if (l === level) recs.push(rec);
  }
  const label = recs.length ? sourceLabel(recs[0]) + (recs.length > 1 ? ` +${recs.length - 1}` : "") : "";
  return { level, label };
}

/** Untrusted content that entered the run at this step: where an injection arrives. */
function entryTrust(step) {
  let worst = null;
  const consider = (l) => { if (l && TRUST_ORDER.includes(l) && (worst === null || trustRank(l) > trustRank(worst))) worst = l; };
  for (const ev of step.events) {
    consider(worstOf(ev.provenance_refs).level);
    if (ev.type === "memory_write") consider(ev.payload?.trust_level);
  }
  return worst;
}

function tmark(level, big = false) {
  if (!level || isTrusted(level)) return "";
  return `<span class="tmark ${tlClass(level)}${big ? " big" : ""}" title="${esc(level)} content entered at this step"></span>`;
}
function tchip(level, src = "", quiet = false) {
  if (!level) return "";
  const foreign = !isTrusted(level);
  return `<span class="tchip ${tlClass(level)}${foreign ? " foreign" : ""}${quiet ? " quiet" : ""}"><span class="sw"></span>${esc(level)}${src ? `<span class="src">· ${esc(src)}</span>` : ""}</span>`;
}
function sens(level) {
  return level ? `<span class="sens ${esc(level)}">${esc(level)}</span>` : "";
}

/* ---------- finding the watched value inside the payload ----------
   The engine records only the first six normalized characters of a tainted value
   (never the secret itself). Normalization lowercases and drops every non-alphanumeric
   character, so we search the same way and map the hit back onto the raw text. */

const normalize = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
const TOKEN_CHAR = /[A-Za-z0-9_\-]/;

function findPlain(text, hit) {
  const idx = [];
  let norm = "";
  for (let i = 0; i < text.length; i++) {
    const c = text[i].toLowerCase();
    if (c.length === 1 && /[a-z0-9]/.test(c)) { norm += c; idx.push(i); }
  }
  const out = [];
  let at = norm.indexOf(hit);
  while (at !== -1) {
    const start = idx[at];
    let end = idx[at + hit.length - 1] + 1;
    while (end < text.length && TOKEN_CHAR.test(text[end])) end++;
    out.push([start, end]);
    at = norm.indexOf(hit, at + hit.length);
  }
  return out;
}
const rot13 = (s) => s.replace(/[a-z]/gi, c => {
  const base = c <= "Z" ? 65 : 97;
  return String.fromCharCode((c.charCodeAt(0) - base + 13) % 26 + base);
});
function decodedTokens(text, pattern, decode, hit) {
  const out = [];
  for (const m of text.matchAll(pattern)) {
    let decoded;
    try { decoded = decode(m[0]); } catch { continue; }
    if (normalize(decoded).includes(hit)) out.push([m.index, m.index + m[0].length]);
  }
  return out;
}
function findEncoded(text, hit, encoding) {
  if (!text || !hit) return [];
  let ranges = [];
  switch (encoding) {
    case "plain": ranges = findPlain(text, hit); break;
    case "rot13": ranges = findPlain(rot13(text), hit); break;
    case "reversed": {
      const rev = text.split("").reverse().join("");
      ranges = findPlain(rev, hit).map(([s, e]) => [text.length - e, text.length - s]);
      break;
    }
    case "url":
      ranges = decodedTokens(text, /[^\s"'<>]*%[0-9A-Fa-f]{2}[^\s"'<>]*/g, decodeURIComponent, hit); break;
    case "base64":
      ranges = decodedTokens(text, /[A-Za-z0-9+/]{16,}={0,2}/g, (t) => {
        const bare = t.replace(/=+$/, "");
        return atob(bare + "=".repeat((4 - bare.length % 4) % 4));
      }, hit);
      break;
    case "hex":
      ranges = decodedTokens(text, /(?:[0-9a-fA-F]{2}){8,}/g,
        (t) => t.match(/../g).map(h => String.fromCharCode(parseInt(h, 16))).join(""), hit);
      break;
    default: ranges = [];
  }
  return ranges.map(([s, e]) => text.slice(s, e)).filter(s => s.length >= 4);
}
function textsOf(value, out = []) {
  if (typeof value === "string") out.push(value);
  else if (Array.isArray(value)) value.forEach(v => textsOf(v, out));
  else if (value && typeof value === "object") Object.values(value).forEach(v => textsOf(v, out));
  return out;
}

const needleCache = new WeakMap();
function needlesFor(step) {
  if (needleCache.has(step)) return needleCache.get(step);
  const f = step.dataflow || {};
  const out = [];
  const hit = String(f.tainted_hit || "").replace(/(\.\.\.|…)$/, "").toLowerCase();
  if (hit) {
    const a = actionOf(step);
    const texts = a ? textsOf([a.arguments, a.content, a.confirmation_for]) : [];
    const found = new Set();
    for (const t of texts) for (const s of findEncoded(t, hit, f.encoding)) found.add(s);
    found.forEach(s => out.push({ s, cls: "taint" }));
  }
  if (f.destination_class === "external") for (const d of f.destinations || []) if (d) out.push({ s: String(d), cls: "dest" });
  needleCache.set(step, out);
  return out;
}

/** Escape raw text, wrapping every occurrence of a needle in a mark. */
function markText(raw, needles) {
  raw = String(raw ?? "");
  const ranges = [];
  for (const n of needles || []) {
    if (!n.s || n.s.length < 3) continue;
    let i = raw.indexOf(n.s);
    while (i !== -1) { ranges.push([i, i + n.s.length, n.cls]); i = raw.indexOf(n.s, i + n.s.length); }
  }
  if (!ranges.length) return esc(raw);
  ranges.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
  let out = "", at = 0;
  for (const [s, e, cls] of ranges) {
    if (s < at) continue;
    out += esc(raw.slice(at, s)) + `<mark class="${cls}">${esc(raw.slice(s, e))}</mark>`;
    at = e;
  }
  return out + esc(raw.slice(at));
}

/* ---------- word-level diff for the before/after view ---------- */

const tokenize = (s) => String(s).match(/[A-Za-z0-9_]+|\s+|[^A-Za-z0-9_\s]/g) || [];
function diffOps(a, b) {
  const A = tokenize(a), B = tokenize(b);
  const ops = [];
  const push = (t, s) => {
    if (!s) return;
    const last = ops[ops.length - 1];
    if (last && last.t === t) last.s += s; else ops.push({ t, s });
  };
  if (A.length * B.length > 250000) {
    // Too long for a table: keep the shared head and tail, mark the middle.
    let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
    let q = 0; while (q < a.length - p && q < b.length - p && a[a.length - 1 - q] === b[b.length - 1 - q]) q++;
    push("=", a.slice(0, p)); push("-", a.slice(p, a.length - q)); push("+", b.slice(p, b.length - q)); push("=", a.slice(a.length - q));
    return ops;
  }
  const n = A.length, m = B.length, w = m + 1;
  const L = new Int32Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      L[i * w + j] = A[i] === B[j] ? L[(i + 1) * w + j + 1] + 1 : Math.max(L[(i + 1) * w + j], L[i * w + j + 1]);
    }
  }
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { push("=", A[i]); i++; j++; }
    else if (L[(i + 1) * w + j] >= L[i * w + j + 1]) { push("-", A[i]); i++; }
    else { push("+", B[j]); j++; }
  }
  while (i < n) push("-", A[i++]);
  while (j < m) push("+", B[j++]);
  return ops;
}
function collapse(s) {
  return s.length > 96 ? `${esc(s.slice(0, 40))}<span class="gap">…</span>${esc(s.slice(-40))}` : esc(s);
}
function renderDiff(ops, side) {
  return ops.map(o => {
    if (o.t === "=") return collapse(o.s);
    if (o.t === "-") return side === "before" ? `<del class="rm">${esc(o.s)}</del>` : "";
    return side === "after" ? `<ins class="add">${esc(o.s)}</ins>` : "";
  }).join("");
}

/* ---------- loading ---------- */

async function loadConfig() {
  try {
    const cfg = await api("/api/config");
    if (cfg && cfg.thresholds) state.thresholds = cfg.thresholds;
  } catch { /* the score bar simply omits the threshold ticks */ }
}

async function loadRuns(initial) {
  let body;
  try {
    body = await api("/api/runs");
    state.listError = null;
  } catch (e) {
    state.listError = e.message || String(e);
    renderRail();
    if (initial || !state.view) renderStage();
    return;
  }
  state.runs = body.runs || [];
  state.roots = body.roots || (body.root ? [body.root] : []);
  state.rootsMissing = body.error || null;
  const sig = state.runs.map(r => `${r.id}:${r.modified}`).join("|");
  const changed = sig !== state.runsSig;
  state.runsSig = sig;

  if (initial) {
    const hash = readHash();
    const target = hash.run && state.runs.some(r => r.id === hash.run) ? hash.run : orderedRuns()[0]?.id;
    renderRail();
    if (target) await openRun(target, hash.step);
    else renderAll();
    return;
  }
  if (!changed) return;
  renderRail();
  if (!state.runId && state.runs.length) { openRun(orderedRuns()[0].id); return; }
  const current = state.runs.find(r => r.id === state.runId);
  if (current && current.modified !== state.runModified) openRun(current.id, state.stepId);
  else if (!state.view) renderStage();
}

async function openRun(id, stepId = null) {
  const token = ++openToken;
  state.runId = id;
  state.runModified = state.runs.find(r => r.id === id)?.modified ?? null;
  renderRail();
  let view;
  try {
    view = await api("/api/run?path=" + encodeURIComponent(id));
  } catch (e) {
    if (token !== openToken) return;
    state.view = null;
    state.viewError = e.message || String(e);
    renderAll();
    return;
  }
  if (token !== openToken) return;
  state.view = view;
  state.viewError = null;
  state.quietOpen = false;
  const ids = view.steps.map(s => s.step_id);
  state.stepId = ids.includes(stepId) ? stepId : defaultStep(view);
  writeHash();
  renderAll();
  revealSelection();
}

/** Open on the most informative step: the first intervention, else the first real decision. */
function defaultStep(view) {
  const decided = view.steps.filter(s => s.decision);
  const target = decided.find(s => s.decision.decision !== "allow") || decided[0] || view.steps[0];
  return target ? target.step_id : null;
}

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const step = p.get("step");
  return { run: p.get("run"), step: step === null || !isNum(step) ? null : Number(step) };
}
function writeHash() {
  if (!state.runId) return;
  const p = new URLSearchParams(location.hash.slice(1));
  p.set("run", state.runId);
  if (state.stepId !== null && state.stepId !== undefined) p.set("step", String(state.stepId));
  else p.delete("step");
  history.replaceState(null, "", "#" + p.toString());
}

/* ---------- rail ---------- */

function groupedRuns() {
  const terms = state.filter.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const matches = (r) => {
    if (!terms.length) return true;
    const s = r.summary || {};
    const hay = [r.scenario, r.defense, defenseLabel(r.defense), r.group, s.domain, s.attack_family,
                 KIND_LABEL[kindOf(s)] || "", s.split, s.attack_success ? "breached" : ""].join(" ").toLowerCase();
    return terms.every(t => hay.includes(t));
  };
  const kindRank = { attack: 0, hard_negative: 1, benign: 2 };
  const groups = new Map();
  for (const r of state.runs) {
    if (!matches(r)) continue;
    const key = r.defense || "unknown";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const out = [...groups.entries()].map(([defense, runs]) => ({
    defense,
    runs: runs.sort((a, b) => ((kindRank[kindOf(a.summary)] ?? 3) - (kindRank[kindOf(b.summary)] ?? 3))
      || a.scenario.localeCompare(b.scenario)),
    newest: Math.max(...runs.map(r => r.modified || 0)),
  }));
  // HARIS first, then baselines; within each, the newest evaluation first.
  out.sort((a, b) => (Number(isHaris(b.defense)) - Number(isHaris(a.defense))) || (b.newest - a.newest));
  return out;
}
const orderedRuns = () => groupedRuns().flatMap(g => g.runs);

function runItem(r) {
  const ok = r.outcome?.task_success;
  const s = r.summary || {};
  const kind = kindOf(r.summary);
  const c = r.counts || {};
  const marks = ["block", "escalate", "rewrite"].filter(d => c[d])
    .map(d => `<span class="d-${d}" title="${plural(c[d], d)}">${GLYPH[d]}${c[d]}</span>`).join("");
  return `<li><button class="run" type="button" data-id="${esc(r.id)}" aria-current="${r.id === state.runId}" title="${esc(r.id)}">
    <span class="run-top"><span class="dot ${ok === true ? "ok" : ok === false ? "no" : ""}"></span><span class="run-name">${esc(r.scenario)}</span></span>
    <span class="run-meta">${kind ? `<span class="kind k-${kind}">${esc(KIND_LABEL[kind])}</span>` : ""}${s.domain ? `<span>${esc(s.domain)}</span>` : ""}<span>${plural(r.steps, "step")}</span>${s.attack_success ? `<span class="breach">breached</span>` : ""}<span class="mini">${marks}</span></span>
  </button></li>`;
}

function renderRail() {
  const list = $("runs");
  const groups = groupedRuns();
  const shown = groups.reduce((n, g) => n + g.runs.length, 0);
  $("run-count").textContent = state.runs.length ? (shown === state.runs.length ? String(shown) : `${shown} of ${state.runs.length}`) : "";
  if (state.listError) {
    list.innerHTML = `<li class="calm" style="padding:.8rem .4rem">Trace API unreachable: ${esc(state.listError)}</li>`;
  } else if (!state.runs.length) {
    list.innerHTML = `<li class="calm" style="padding:.8rem .4rem">No runs yet.</li>`;
  } else if (!shown) {
    list.innerHTML = `<li class="calm" style="padding:.8rem .4rem">No run matches “${esc(state.filter)}”.</li>`;
  } else {
    list.innerHTML = groups.map(g => `<li class="group-head"><span class="label">${isHaris(g.defense) ? icon("shield") : ""}${esc(defenseLabel(g.defense))}</span><span class="rail-count">${isHaris(g.defense) ? "" : "baseline · "}${g.runs.length}</span></li>${g.runs.map(runItem).join("")}`).join("");
  }
  $("rail-foot").textContent = state.roots.length
    ? `Watching ${plural(state.roots.length, "folder")} · refreshes every ${POLL_MS / 1000} s`
    : "";
}

/* ---------- top bar ---------- */

function renderTop() {
  const v = state.view;
  $("run-id").textContent = v ? (v.run_id || v.scenario) : "no run loaded";
  $("run-id").title = v?.source || "";
  document.title = v ? `${v.scenario} · HARIS trace viewer` : "HARIS trace viewer";
  const present = document.documentElement.classList.contains("present");
  $("mode").innerHTML = present ? `PRESENTATION MODE &nbsp;<kbd>P</kbd>&nbsp; exit` : `<kbd>P</kbd>&nbsp; present`;
  $("mode").title = present ? "Leave presentation mode" : "Presentation mode: larger type for a 1080p recording";
}

/* ---------- stage ---------- */

function emptyStage(title, body) {
  return `<div class="empty-stage"><h2>${esc(title)}</h2>${body}</div>`;
}

function renderStage() {
  const stage = $("stage");
  if (state.listError && !state.view) {
    stage.innerHTML = emptyStage("The trace API is not answering", `
      <p class="calm">${esc(state.listError)}</p>
      <p class="calm">Start the viewer with <code>scripts/run_dashboard.sh &lt;kit&gt;</code>. This page retries every ${POLL_MS / 1000} seconds.</p>`);
    return;
  }
  if (state.viewError) {
    stage.innerHTML = emptyStage("This run could not be loaded", `<p class="calm">${esc(state.viewError)}</p>
      <p class="calm">Pick another run, or rerun the scenario.</p>`);
    return;
  }
  if (!state.view) {
    if (!state.runs.length) {
      const roots = state.roots.length ? `<ul>${state.roots.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : "";
      stage.innerHTML = emptyStage(state.rootsMissing ? "No artifacts folder yet" : "No runs yet", `
        <p class="calm">Looking for run artifacts under:</p>${roots}
        <p class="calm">Record some with <code>scripts/run_eval.sh &lt;kit&gt;</code> or <code>scripts/run_redteam.sh &lt;kit&gt;</code>. New runs appear here within ${POLL_MS / 1000} seconds.</p>`);
      return;
    }
    stage.innerHTML = `<div class="empty-stage"><p class="calm">Loading run…</p></div>`;
    return;
  }
  stage.innerHTML = `${runHead()}${stripHtml()}<div class="work"><div class="spine" id="spine">${spineHtml()}</div><div class="inspector" id="inspector">${inspectorHtml()}</div></div>`;
}

function renderAll() {
  renderTop();
  renderRail();
  renderStage();
}

/** Selection changes redraw only what depends on the step, keeping the spine's scroll. */
function renderWork() {
  const spine = $("spine");
  if (!spine) { renderStage(); return; }
  document.querySelectorAll(".cell").forEach(el =>
    el.setAttribute("aria-current", String(Number(el.dataset.step) === state.stepId)));
  const keep = spine.scrollTop;
  spine.innerHTML = spineHtml();
  spine.scrollTop = keep;
  $("inspector").innerHTML = inspectorHtml();
}

function revealSelection() {
  const cell = document.querySelector(`.cell[aria-current="true"]`);
  if (cell) cell.scrollIntoView({ block: "nearest", inline: "nearest" });
  const spine = $("spine");
  const row = spine?.querySelector(`.row[aria-current="true"]`);
  if (!spine || !row) return;
  // Keep the row in view with enough of its thread to read, but no more: scrolling the
  // task and the earlier steps away costs the viewer the story that led here.
  const r = row.getBoundingClientRect(), item = row.parentElement.getBoundingClientRect();
  const s = spine.getBoundingClientRect();
  if (r.top < s.top + 8) { spine.scrollTop += r.top - s.top - 8; return; }
  const wanted = Math.min(item.bottom, r.bottom + s.height * .45);
  if (wanted > s.bottom - 8) spine.scrollTop += Math.min(wanted - s.bottom + 8, r.top - s.top - 8);
  const current = document.querySelector(`.run[aria-current="true"]`);
  if (current) current.scrollIntoView({ block: "nearest" });
}

/* ---------- run header ---------- */

function stat(label, value, cls = "", width = "") {
  return `<div class="stat ${width}"><span class="label">${esc(label)}</span><span class="stat-v ${cls}">${value}</span></div>`;
}

function runHead() {
  const v = state.view;
  const s = v.summary;
  const kind = kindOf(s);
  const badges = [];
  if (kind === "attack") badges.push(`<span class="badge kind k-attack">${icon("warn")}Attack</span>`);
  else if (kind) badges.push(`<span class="badge kind k-${kind}">${esc(KIND_LABEL[kind])}</span>`);
  if (s?.domain) badges.push(`<span class="badge">${esc(s.domain)}</span>`);
  if (kind === "attack" && s.attack_family && s.attack_family !== "none") badges.push(`<span class="badge family">${esc(s.attack_family.replaceAll("_", " "))}</span>`);
  badges.push(isHaris(v.defense)
    ? `<span class="badge defense">${icon("shield")}${esc(defenseLabel(v.defense))}</span>`
    : `<span class="badge defense baseline" title="A baseline defense shipped in the kit">${esc(defenseLabel(v.defense))} · baseline</span>`);
  if (!v.has_reasoning && v.steps.some(st => st.decision)) {
    badges.push(`<span class="badge warn" title="No HARIS journal entry joins this trace, so the risk cannot be decomposed.">no reasoning journal</span>`);
  }

  const c = v.counts || {};
  const interventions = (c.block || 0) + (c.escalate || 0) + (c.rewrite || 0);
  const violations = v.outcome?.violations || [];
  const ok = v.outcome?.task_success;
  const graders = (s?.graders || []).map(g => `${g.passed ? "✓" : "✗"} ${g.condition}`).join("\n");
  const taskTitle = [v.outcome?.conditions?.summary, graders].filter(Boolean).join("\n");

  const stats = [];
  if (s && kind === "attack") {
    stats.push(s.attack_success
      ? stat("Attack", `${icon("xCircle")}Succeeded`, "bad", "mid")
      : stat("Attack", `${icon("shieldCheck")}Stopped`, "good", "mid"));
  }
  const task = ok === true ? stat("Task", `${icon("checkCircle")}Completed`, "good", "wide")
    : ok === false ? stat("Task", `${icon("xCircle")}Failed`, "bad", "wide")
    : stat("Task", "Unknown", "", "wide");
  stats.push(task.replace('<div class="stat', `<div title="${esc(taskTitle)}" class="stat`));
  const violationTitle = violations.map(p => `${p.severity || ""} ${p.rule_id || ""}: ${p.message || ""}`.trim()).join("\n");
  stats.push((violations.length
    ? stat("Policy violations", `${icon("warn", "bad")}${violations.length}`, "bad", "wide")
    : stat("Policy violations", `${icon("check", "good")}0`, "", "wide")
  ).replace('<div class="stat', `<div title="${esc(violationTitle)}" class="stat`));
  stats.push(stat("Interventions", String(interventions), "", "mid"));
  stats.push(stat("Allowed", String(c.allow || 0)));

  return `<section class="runhead">
    <div class="runhead-l"><div class="badges">${badges.join("")}</div><span class="scenario" title="${esc(v.scenario)}">${esc(v.scenario)}</span></div>
    <div class="stats">${stats.join("")}</div>
  </section>`;
}

/* ---------- step strip ---------- */

function stripHtml() {
  return `<nav class="strip" id="strip" aria-label="Steps">${state.view.steps.map(stripCell).join("")}</nav>`;
}
function stripCell(step) {
  const d = decisionOf(step) || "none";
  const lab = stepLabel(step);
  const risk = step.decision ? clamp01(step.decision.risk_score) : null;
  const title = step.decision ? `step ${step.step_id} · ${d} · risk ${num(risk)}` : `step ${step.step_id} · ${lab.name}`;
  return `<button class="cell d-${d}" type="button" data-step="${step.step_id}" aria-current="${step.step_id === state.stepId}" title="${esc(title)}">
    <span class="cell-top">${GLYPH[d]}<span class="cell-word">${esc(lab.word)}</span><span class="cell-id">${tmark(entryTrust(step))}${pad2(step.step_id)}</span></span>
    <span class="cell-tool">${esc(lab.name)}</span>
    <span class="cell-bar${risk === null ? " empty" : ""}">${risk === null ? "" : `<i style="width:${Math.max(risk * 100, 2).toFixed(1)}%"></i>`}</span>
  </button>`;
}

/* ---------- spine ---------- */

function spineHtml() {
  const v = state.view;
  const goals = v.steps.flatMap(s => s.events.filter(e => e.type === "user_message"));
  const level = goals[0] ? worstOf(goals[0].provenance_refs).level : null;
  const goalBody = goals.length
    ? goals.map((e, i) => `<div class="goal-turn">${goals.length > 1 ? `<span class="label">Turn ${Number(e.payload?.turn ?? i) + 1}</span>` : ""}<p>${esc(e.payload?.text || "")}</p></div>`).join("")
    : `<p class="calm">No task was recorded in this trace.</p>`;
  return `<section class="goal"><div class="goal-head"><span class="label lg">What the user actually asked for</span>${tchip(level, "", true)}</div>${goalBody}</section>
    <ol class="rows">${v.steps.map(rowHtml).join("")}</ol>`;
}

function rowHtml(step) {
  const d = decisionOf(step);
  const lab = stepLabel(step);
  const selected = step.step_id === state.stepId;
  const codes = codesOf(step);
  const risk = step.decision ? clamp01(step.decision.risk_score) : null;
  const what = d
    ? `<span class="row-word">${esc(lab.word)}</span><span class="row-tool">${esc(lab.name)}</span>`
    : `<span class="row-tool dim">${esc(lab.name)}</span>`;
  const right = risk === null ? "" : `<span class="risk-mini"><b>${num(risk)}</b><span><i style="width:${Math.max(risk * 100, 2).toFixed(1)}%"></i></span></span>`;
  return `<li><button class="row d-${d || "none"}" type="button" data-step="${step.step_id}" aria-current="${selected}" aria-expanded="${selected}">
      <span class="row-id">${pad2(step.step_id)}</span>${GLYPH[d || "none"]}
      <span class="row-main"><span class="row-what">${what}</span>${codes.length ? `<span class="row-codes">${esc(codes.join("  "))}</span>` : ""}</span>
      <span class="row-right">${tmark(entryTrust(step), true)}${right}</span>
    </button>${selected ? threadHtml(step) : ""}</li>`;
}

function card({ type, iconName, actor = "", level = null, source = "", body = "", note = "", cls = "", prose = false }) {
  const foreign = level && !isTrusted(level);
  return `<div class="ev ${foreign ? `foreign ${tlClass(level)}` : ""} ${cls}">
    <span class="ev-ico">${icon(iconName)}</span>
    <div class="ev-head"><span class="ev-type">${esc(type)}</span>${actor ? `<span class="ev-actor">${esc(actor)}</span>` : ""}${level ? `<span class="ev-chips">${tchip(level, source)}</span>` : ""}</div>
    <div class="ev-body${prose ? " prose" : ""}">${body}</div>${note ? `<div class="ev-note">${note}</div>` : ""}
  </div>`;
}

function callHtml(tool, args, needles) {
  const parts = Object.entries(args || {}).map(([k, v]) =>
    `<span class="k">${esc(k)}=</span>${markText(clip(str(v), 700), needles)}`);
  return `<b>${esc(tool || "?")}</b>(${parts.join(", ")})`;
}

function actionHtml(a, needles) {
  if (!a) return `<span class="v">The action was not recorded.</span>`;
  if (a.type === "tool_call") return callHtml(a.tool, a.arguments, needles);
  if (a.type === "request_confirmation") {
    const t = a.confirmation_for;
    return `<b>request_confirmation</b> for ${t ? callHtml(t.tool || t.type, t.arguments, needles) : "an unspecified action"}`;
  }
  return `<b>${esc(a.type)}</b> ${markText(clip(a.content || "", 700), needles)}`;
}

function summarize(value) {
  if (value === null || value === undefined) return "";
  if (typeof value !== "object") return clip(String(value), 420);
  const text = Array.isArray(value) ? JSON.stringify(value)
    : Object.entries(value).map(([k, x]) => `${k}=${typeof x === "string" ? x : JSON.stringify(x)}`).join(", ");
  return clip(text, 420);
}

function resultHtml(p, needles) {
  const status = p.succeeded ? `<span class="ok">ok</span>` : `<span class="err">error</span>`;
  const value = p.succeeded ? p.result : (p.error ?? p.result);
  const effects = (p.effects || []).length ? ` <span class="k">effects=</span>${esc(p.effects.join(", "))}` : "";
  const brief = summarize(value);
  const full = typeof value === "object" && value !== null ? JSON.stringify(value, null, 2) : "";
  const more = full && full.length > brief.length + 40
    ? `<details class="more"><summary>full result</summary><pre>${markText(clip(full, 12000), needles)}</pre></details>` : "";
  return `<b>${esc(p.tool || "")}</b> ${status}${effects} <span class="v">${markText(brief, needles)}</span>${more}`;
}

function taintNote(step, needles) {
  const f = step.dataflow || {};
  if (!f.tainted_hit) return "";
  const value = needles.find(n => n.cls === "taint")?.s;
  const shown = value ? `<mark class="taint">${esc(clip(value, 14))}</mark>` : `<code>${esc(f.tainted_hit)}</code>`;
  const enc = f.encoding && !["plain", "none"].includes(f.encoding) ? ` It travels ${esc(f.encoding)}-encoded.` : "";
  if (f.restricted_copy) return `${shown} is restricted: it may reach no sink, not even an internal record.${enc}`;
  if (f.destination_class === "external") return `${shown} is a watched value headed outside the organisation.${enc}`;
  return `${shown} is a watched value carried by this action.${enc}`;
}

function eventCard(ev, step, needles) {
  const p = ev.payload || {};
  const { level, label } = worstOf(ev.provenance_refs);
  switch (ev.type) {
    case "user_message":
      return card({ type: "user message", iconName: "user", actor: ev.actor, level, source: label, prose: true, body: markText(p.text, needles) });
    case "tool_request":
      return card({
        type: decisionOf(step) === "rewrite" ? "tool request · as rewritten" : "tool request",
        iconName: "arrowR", actor: ev.actor, level, source: label,
        body: callHtml(p.tool, p.arguments, needles) + (p.confirmed ? ` <span class="ok">human-confirmed</span>` : ""),
      });
    case "retrieval_result":
    case "tool_result":
      return card({
        type: ev.type === "retrieval_result" ? "retrieval result" : "tool result",
        iconName: ev.type === "retrieval_result" ? "doc" : "arrowL", actor: ev.actor, level, source: label,
        body: resultHtml(p, needles),
      });
    case "memory_read":
      return card({ type: "memory recalled", iconName: "memory", actor: ev.actor, level, source: label,
        body: `<span class="v">entries</span> ${esc((p.entries || []).join(", ") || "none")}`,
        note: level && !isTrusted(level) ? "Recalled content keeps the trust level it was stored with." : "" });
    case "memory_write": {
      const l = TRUST_ORDER.includes(p.trust_level) ? p.trust_level : level;
      return card({ type: "memory written", iconName: "memory", actor: ev.actor, level: l, source: p.entry_id || "",
        body: markText(clip(p.content || "", 700), needles),
        note: l && !isTrusted(l) ? "Stored with its taint: when this entry is recalled it is still untrusted." : "" });
    }
    case "model_output":
      if (p.malformed_action) return card({ type: "malformed output", iconName: "chat", actor: ev.actor, body: `<span class="err">${esc(p.malformed_action)}</span>` });
      return card({ type: p.final ? "final response" : "response", iconName: "chat", actor: ev.actor, prose: true, body: markText(clip(p.content || "", 900), needles) });
    case "human_confirmation":
      return card({ type: "human confirmation", iconName: "user", actor: ev.actor,
        body: `human <b class="${p.approved ? "ok" : "err"}">${p.approved ? "approved" : "denied"}</b> <b>${esc(p.tool || "the action")}</b>` });
    case "policy_violation":
      return card({ type: `policy violation${p.severity ? " · " + p.severity : ""}`, iconName: "warn", actor: ev.actor, cls: "violation",
        body: `<b>${esc(p.rule_id || "violation")}</b> ${esc(p.message || "")}${p.security_property ? `<br><span class="k">${esc(p.security_property)}</span>` : ""}` });
    case "task_success":
    case "task_failure": {
      const good = ev.type === "task_success";
      return card({ type: good ? "task completed" : "task failed", iconName: good ? "checkCircle" : "xCircle", actor: ev.actor,
        cls: good ? "outcome-ok" : "outcome-no",
        body: `${esc(p.summary || "")}${p.termination && p.termination !== "completed" ? ` <span class="err">(${esc(p.termination)})</span>` : ""}` });
    }
    default:
      return card({ type: String(ev.type || "event").replaceAll("_", " "), iconName: "doc", actor: ev.actor, level, source: label,
        body: esc(clip(JSON.stringify(p), 600)) });
  }
}

function threadHtml(step) {
  const needles = needlesFor(step);
  const cards = [];
  const obs = step.observation;
  if (obs && obs.content && obs.kind !== "user_message") {
    const { level, label } = worstOf(obs.provenance_ids);
    cards.push(card({ type: `agent had just read · ${String(obs.kind).replaceAll("_", " ")}`, iconName: "eye", actor: "agent context",
      level, source: label, body: `<span class="v">${markText(clip(obs.content, 700), needles)}</span>` }));
  }
  const d = decisionOf(step);
  if (d && d !== "allow") {
    const fate = { block: "never executed", escalate: "held for a human", rewrite: "replaced before it ran" }[d];
    cards.push(card({ type: `proposed · ${fate}`, iconName: "shield", actor: "agent", cls: `proposed d-${d}`,
      body: actionHtml(actionOf(step), needles), note: taintNote(step, needles) }));
  }
  for (const ev of step.events) {
    if (ev.type === "defense_decision") continue;
    cards.push(eventCard(ev, step, needles));
  }
  return cards.length ? `<div class="thread">${cards.join("")}</div>` : "";
}

/* ---------- inspector ---------- */

function inspectorHtml() {
  const step = stepById(state.stepId);
  if (!step) return `<div class="v-empty"><p class="calm">Select a step to see why it was decided that way.</p></div>`;
  if (!step.decision) {
    const lab = stepLabel(step);
    return `<section class="v-empty d-none"><span class="pill">${GLYPH.none}${esc(lab.word)}</span>
      <p class="calm">Step ${pad2(step.step_id)} · ${esc(lab.name)}. The defense judges proposed actions, and nothing was proposed here. Press <kbd>J</kbd> for the next step or <kbd>B</kbd> for the first intervention.</p></section>`;
  }
  return `${verdictHtml(step)}${changedHtml(step)}<div class="panels">${scorePanel(step)}${trustPanel(step)}${flowPanel(step)}</div>`;
}

function firstArg(a) {
  if (!a) return "";
  if (a.type === "tool_call" || a.type === "request_confirmation") {
    const args = a.type === "tool_call" ? a.arguments : a.confirmation_for?.arguments;
    const first = Object.entries(args || {})[0];
    return first ? `<span class="k"> · ${esc(first[0])}=</span>${esc(clip(str(first[1]), 32))}` : "";
  }
  return a.content ? `<span class="k"> · </span>“${esc(clip(a.content, 40))}”` : "";
}

function thenHtml(step) {
  const steps = state.view.steps;
  const i = steps.indexOf(step);
  const human = step.events.find(e => e.type === "human_confirmation");
  const pre = human ? `Human ${human.payload?.approved ? "approved" : "denied"} it. ` : "";
  const next = steps.slice(i + 1).find(s => s.decision);
  if (next) {
    const nd = decisionOf(next) || "none";
    return `${pre}Then: <b class="mono">${esc(actionName(actionOf(next)))}</b> · <span class="dword d-${nd}">${esc(nd.toUpperCase())}</span> (step ${pad2(next.step_id)})`;
  }
  const ok = state.view.outcome?.task_success;
  const end = ok === true ? "the task completed" : ok === false ? "the task failed" : "the trace ends";
  return `${pre}Then: the run ended and ${end}.`;
}

function verdictHtml(step) {
  const d = decisionOf(step) || "none";
  const dec = step.decision;
  const timings = Object.entries(step.timings || {}).map(([k, v]) => `${k} ${fmtMs(v)}`);
  if (isNum(step.total_ms)) timings.push(`total ${fmtMs(step.total_ms)}`);
  if (isNum(step.latency_ms)) timings.push(`round trip ${fmtMs(step.latency_ms)}`);
  const time = isNum(step.total_ms)
    ? `<span class="v-time" title="${esc(timings.join(" · "))}">${icon("clock")}decided in <b>${fmtMs(step.total_ms)}</b></span>`
    : isNum(step.latency_ms) ? `<span class="v-time" title="Measured by the simulator, including the HTTP round trip">${icon("clock")}round trip <b>${fmtMs(step.latency_ms)}</b></span>` : "";
  const t = step.trust || {};
  const tags = [];
  if (t.least_trusted_seen) tags.push(`<span class="v-tag">least trusted seen ${tchip(t.least_trusted_seen)}</span>`);
  if (t.most_sensitive_seen) tags.push(`<span class="v-tag">most sensitive ${sens(t.most_sensitive_seen)}</span>`);
  if (step.plan?.confirmed) tags.push(`<span class="v-tag ok">${icon("check")}confirmed by a human</span>`);
  if (dec.defense_error) tags.push(`<span class="v-tag err">defense error: ${esc(dec.defense_error)}</span>`);
  if (!step.journal) tags.push(`<span class="v-tag">no journal entry: reasons unavailable</span>`);
  return `<section class="verdict d-${d}">
    <div class="v-left">
      <span class="pill" title="${esc(dec.explanation || "")}">${GLYPH[d]}${esc(d)}</span>
      <div class="v-sub"><span class="mono">step ${pad2(step.step_id)}</span>${time}</div>
    </div>
    <div class="v-risk" title="${esc(dec.explanation || "")}">
      <span class="num">${num(dec.risk_score)}</span>
      <div class="v-risk-meta"><span class="label">risk</span><span class="conf">confidence <b>${num(dec.confidence)}</b></span></div>
    </div>
    <div class="v-facts">
      <span class="v-line"><span class="k">proposed </span><b>${esc(actionName(actionOf(step)))}</b>${firstArg(actionOf(step))}</span>
      <span class="v-then">${icon("next")}<span>${thenHtml(step)}</span></span>
      ${tags.length ? `<span class="v-tags">${tags.join("")}</span>` : ""}
    </div>
  </section>`;
}

/* What changed: the proposed action beside the one HARIS swapped in. */
function changedHtml(step) {
  if (decisionOf(step) !== "rewrite") return "";
  const before = actionOf(step), after = rewrittenOf(step);
  if (!before || !after) return "";
  const nameB = actionName(before), nameA = actionName(after);
  const toolChanged = nameB !== nameA;
  const argsB = before.arguments || {}, argsA = after.arguments || {};
  const keys = [...new Set([...Object.keys(argsB), ...Object.keys(argsA)])];
  const changed = keys.filter(k => str(argsB[k]) !== str(argsA[k]));
  const same = keys.filter(k => !changed.includes(k));
  const contentChanged = (before.content || "") !== (after.content || "");
  const fields = changed.map(k => `arguments.${k}`);
  if (contentChanged) fields.push("content");
  if (!!before.final !== !!after.final) fields.push("final");

  const ops = {};
  changed.forEach(k => { ops[k] = diffOps(str(argsB[k]), str(argsA[k])); });
  const contentOps = contentChanged ? diffOps(before.content || "", after.content || "") : null;

  const chips = fields.map(f => `<span class="fchip">${esc(f)}</span>`).join("");
  const summary = toolChanged
    ? `<span>Tool swapped:</span><span class="fchip">${esc(nameB)} → ${esc(nameA)}</span>${fields.length ? `<span>and ${plural(fields.length, "field")} changed:</span>${chips}` : ""}`
    : fields.length ? `<span>Same tool · ${plural(fields.length, "field")} changed:</span>${chips}` : `<span>No field differs.</span>`;

  const side = (which, action) => {
    const isBefore = which === "before";
    const name = actionName(action);
    const tool = toolChanged ? (isBefore ? `<del class="rm">${esc(name)}</del>` : `<ins class="add">${esc(name)}</ins>`) : esc(name);
    const unchanged = same.map(k => `${k}=${clip(str(action.arguments?.[k]), 28)}`).join(" · ");
    const rows = changed.map(k => `<div class="frow"><span class="fkey">${esc(k)}</span><span class="fval">${
      (isBefore ? !(k in argsB) : !(k in argsA)) ? `<span class="k">absent</span>` : renderDiff(ops[k], which)}</span></div>`).join("");
    const contentRow = contentOps ? `<div class="frow"><span class="fkey">content</span><span class="fval">${renderDiff(contentOps, which)}</span></div>` : "";
    return `<div class="side ${which}">
      <div class="side-head"><span class="side-title">${isBefore ? "Before · proposed" : "After · swapped in"}</span>${isBefore ? GLYPH.block : GLYPH.rewrite}</div>
      <div class="side-tool"><b>${tool}</b>${unchanged ? `<span>${esc(unchanged)} · unchanged</span>` : ""}</div>
      ${rows || contentRow ? `<div>${rows}${contentRow}</div>` : ""}
    </div>`;
  };
  return `<section class="changed">
    <div class="sec-head"><span class="label lg">What changed</span><div class="changed-sum">${summary}</div></div>
    <div class="ba">${side("before", before)}<div class="swap">${icon("next")}SWAPPED IN</div>${side("after", after)}</div>
  </section>`;
}

function scorePanel(step) {
  const d = decisionOf(step) || "none";
  const risk = clamp01(step.decision.risk_score);
  const signals = step.signals || [];
  const firedTest = (s) => Number(s.value) > 0 && Number(s.contribution) > 0;
  const fired = signals.filter(firedTest).sort((a, b) => b.contribution - a.contribution);
  const quiet = signals.filter(s => !firedTest(s));

  // Noisy-OR, as the engine fuses: each signal removes a share of the remaining survival.
  let survival = 1;
  const segs = fired.map((s, i) => {
    const c = clamp01(s.contribution);
    const seg = { s, n: i + 1, left: 1 - survival, width: survival * c, mix: SEG_MIX[Math.min(i, SEG_MIX.length - 1)] };
    survival *= 1 - c;
    return seg;
  });
  const fused = 1 - survival;
  const scale = fused > 0 ? risk / fused : 0;
  segs.forEach(g => { g.left *= scale; g.width *= scale; });

  const T = state.thresholds || {};
  const hasT = isNum(T.escalate) && isNum(T.block);
  const pct = (x) => `${(clamp01(x) * 100).toFixed(2)}%`;
  const labels = hasT ? `<div class="thr-labels">
      <div class="thr-label" style="left:${pct(T.escalate)}"><b>${num(T.escalate)}</b><span style="color:var(--escalate-ink)">ESCALATE</span></div>
      <div class="thr-label" style="left:${pct(T.block)}"><b>${num(T.block)}</b><span style="color:var(--block-ink)">BLOCK / REWRITE</span></div>
    </div>` : "";
  const zones = hasT ? `<div class="zone" style="left:${pct(T.escalate)};width:${pct(T.block - T.escalate)};background:color-mix(in srgb, var(--escalate) 14%, var(--raised))"></div>
      <div class="zone" style="left:${pct(T.block)};right:0;background:color-mix(in srgb, var(--block) 16%, var(--raised))"></div>` : "";
  const segHtml = segs.map(g => `<div class="seg" title="${esc(g.s.code)} adds ${num(g.width)}" style="left:${pct(g.left)};width:${pct(g.width)};background:color-mix(in srgb, var(--dc) ${g.mix}%, white)">${g.width >= .035 ? `<span>${g.n}</span>` : ""}</div>`).join("");
  const ticks = hasT ? `<div class="thr" style="left:${pct(T.escalate)}"></div><div class="thr" style="left:${pct(T.block)}"></div>` : "";
  const marker = `<div class="marker" style="left:${pct(risk)}"><svg viewBox="0 0 14 9" aria-hidden="true"><path d="M7 0L14 9H0z" style="fill:var(--dci)"/></svg><b>${num(risk)}</b></div>`;
  const bar = `<div class="score">${labels}<div class="track"><div class="track-fill">${zones}${segHtml}</div>${ticks}</div>${marker}</div>`;

  const sigRow = (s, n, mix) => `<div class="sig">
      ${n ? `<span class="sig-n" style="background:color-mix(in srgb, var(--dc) ${mix}%, white)">${n}</span>` : `<span class="sig-n quiet"></span>`}
      <div class="sig-body">
        <div class="sig-top"><span class="sig-code">${esc(s.code)}</span><span class="sig-math">${num(s.weight)} × ${num(s.value)} = <b>${num(s.contribution)}</b></span></div>
        ${s.detail ? `<span class="sig-detail">${esc(s.detail)}</span>` : ""}
      </div></div>`;

  let body;
  if (!signals.length) {
    body = `<p class="calm">The trace records the final score but not its parts: no HARIS journal entry joins this step${isHaris(state.view.defense) ? "" : ", because it was decided by a baseline defense"}.</p>`;
  } else {
    const legend = fired.length
      ? `<div class="sigs">${segs.map(g => sigRow(g.s, g.n, g.mix)).join("")}</div>`
      : `<p class="calm">Nothing fired: the action matches what the user asked for (GOAL_ALIGNED).</p>`;
    const quietHtml = quiet.length ? `<button class="quiet-btn" type="button" data-quiet aria-expanded="${state.quietOpen}">${icon("chevron")}${plural(quiet.length, "signal")} quiet<span class="codes">${esc(quiet.map(s => s.code).join(", "))}</span></button>
      ${state.quietOpen ? `<div class="sigs quiet-list">${quiet.map(s => sigRow(s, 0, 0)).join("")}</div>` : ""}` : "";
    body = legend + quietHtml;
  }
  return `<section class="panel d-${d}">
    <div class="sec-head"><span class="label lg">Why the score is what it is</span><span class="sec-aside">${signals.length ? `${plural(fired.length, "signal")} fired` : ""}</span></div>
    ${bar}${body}
  </section>`;
}

function trustPanel(step) {
  const records = step.journal?.provenance || [];
  const policy = step.plan?.policy_id;
  const head = `<div class="sec-head"><span class="label lg">Trust chain</span><span class="sec-aside">${records.length ? plural(records.length, "source") : ""}</span></div>`;
  if (!records.length && !policy) {
    return `<section class="panel">${head}<p class="calm">No provenance was recorded for this step. Only HARIS writes the journal that carries it.</p></section>`;
  }
  const read = new Set(step.observation?.provenance_ids || []);
  const byLevel = Object.fromEntries(TRUST_ORDER.map(l => [l, []]));
  if (policy) byLevel.system_policy.push({ label: `policy ${policy}`, title: "The policy this action was judged under (policy_context.policy_id)" });
  for (const r of [...records].sort((a, b) => String(a.id).localeCompare(String(b.id)))) {
    if (!byLevel[r.trust_level]) continue;
    byLevel[r.trust_level].push({
      label: sourceLabel(r), sensitivity: r.sensitivity, read: read.has(r.id),
      title: `${r.id} · ${r.source_type || "source"} from ${r.origin_actor || "?"} via ${r.retrieved_via || "?"}${read.has(r.id) ? " · the agent had just read this" : ""}`,
    });
  }
  const rung = (level) => {
    const items = byLevel[level];
    const foreign = !isTrusted(level);
    const name = `<div class="rung-name"><span class="sw"></span>${esc(level)}</div>`;
    if (!items.length) {
      return `<div class="rung empty ${tlClass(level)}${foreign ? " foreign-level" : ""}">${name}<span class="rung-none">nothing at this level</span></div>`;
    }
    // Only the sensitivities that constrain where data may go get a badge; public and
    // internal are the default and would crowd the ladder. The tooltip keeps the rest.
    const chips = items.map(it => `<span class="src ${tlClass(level)}${foreign ? " foreign" : ""}${it.read ? " read" : ""}" title="${esc(it.title)}${it.sensitivity ? ` · ${esc(it.sensitivity)}` : ""}">${it.read ? icon("eye") : ""}<b>${esc(it.label)}</b>${["confidential", "restricted"].includes(it.sensitivity) ? sens(it.sensitivity) : ""}</span>`).join("");
    return `<div class="rung ${tlClass(level)}${foreign ? " foreign" : ""}">${name}<div class="srcs">${chips}</div></div>`;
  };
  const boundary = `<div class="boundary"><b>TRUST BOUNDARY</b><i></i><span>authorize ↑ · evidence only ↓</span></div>`;
  return `<section class="panel">${head}<div class="ladder">${TRUST_ORDER.map((l, i) => (i === 3 ? boundary : "") + rung(l)).join("")}</div></section>`;
}

function flowPanel(step) {
  const head = `<div class="sec-head"><span class="label lg">Data flow</span></div>`;
  if (!step.journal) {
    return `<section class="panel flow-panel">${head}<p class="calm">No data-flow record: this step has no HARIS journal entry.</p></section>`;
  }
  const f = step.dataflow || {};
  const d = decisionOf(step);
  const hit = Boolean(f.tainted_hit);
  const routed = f.destination_class === "internal" || f.destination_class === "external";
  const watch = f.tainted_value_count ? `${plural(f.tainted_value_count, "value")} under watch in this run.` : "No value is under watch yet.";
  if (!hit && !routed) {
    return `<section class="panel flow-panel">${head}<p class="calm">Nothing leaves through this action: it names no destination and carries no watched value.</p><p class="flow-note">${esc(watch)}</p></section>`;
  }
  const needles = needlesFor(step);
  const value = needles.find(n => n.cls === "taint")?.s;
  // The engine names a value's sensitivity only when it is restricted; otherwise all we
  // know is that it is under watch, and borrowing most_sensitive_seen would overstate it.
  const aside = f.restricted_copy ? sens("restricted") : `<span class="v">watched value</span>`;
  // Whether an allowed flow was a leak is the evaluator's call, recorded as a violation.
  const violations = step.events.filter(e => e.type === "policy_violation").map(e => e.payload || {});
  const leaked = violations.some(p => p.kind === "data_flow" || p.security_property === "no_sensitive_data_to_untrusted_sink");

  const source = hit
    ? `<div class="fnode secret"><div class="fnode-head">${icon("key")}<span class="fnode-role">Sensitive</span><span class="fnode-aside">${aside}</span></div>
        <span class="fnode-val">${esc(value || f.tainted_hit)}</span></div>`
    : `<div class="fnode"><div class="fnode-head">${icon("doc")}<span class="fnode-role">Payload</span></div><span class="fnode-val dim">no watched value in it</span></div>`;
  const [encName, encNote] = ENCODING[f.encoding] || [f.encoding || "—", ""];
  const encoding = `<div class="fnode"><div class="fnode-head">${icon("code")}<span class="fnode-role">Encoding</span><span class="fnode-aside">${esc(encNote)}</span></div><span class="fnode-val enc">${esc(encName)}</span></div>`;

  const plain = `<div class="flink"><span class="line"></span>${TIP}</div>`;
  let cut = plain;
  if (hit && d && d !== "allow") {
    const human = step.events.find(e => e.type === "human_confirmation");
    const tag = d === "rewrite" ? "redacted here" : d === "block" ? "stopped here"
      : human?.payload?.approved ? "released by a human" : "held for a human";
    cut = `<div class="flink cut d-${d}"><span class="line"></span>${TIP}<span class="x">${icon("x")}</span><span class="tag">${tag}</span></div>`;
  } else if (hit && leaked) {
    cut = `<div class="flink leak"><span class="line"></span>${TIP}<span class="tag">leaked</span></div>`;
  } else if (hit) {
    cut = `<div class="flink pass d-allow"><span class="line"></span>${TIP}<span class="tag">allowed</span></div>`;
  }

  const a = actionOf(step);
  let sink;
  if (routed) {
    const ext = f.destination_class === "external";
    const dests = f.destinations || [];
    sink = `<div class="fnode${ext ? " sink-ext" : ""}"><div class="fnode-head">${icon(ext ? "globe" : "building")}<span class="fnode-role">Sent to</span><span class="fnode-aside"><span class="dest-badge${ext ? " ext" : ""}">${ext ? "EXTERNAL" : "INTERNAL"}</span></span></div>
      <span class="fnode-val">${esc(dests[0] || f.destination_class)}${dests.length > 1 ? `<span class="k"> +${dests.length - 1}</span>` : ""}</span></div>`;
  } else {
    const idArg = Object.entries(a?.arguments || {}).find(([k, v]) => /(^|_)id$/.test(k) && typeof v === "string");
    sink = `<div class="fnode sink-ext"><div class="fnode-head">${icon("record")}<span class="fnode-role">Written to</span><span class="fnode-aside"><span class="dest-badge ext">RECORD</span></span></div>
      <span class="fnode-val">${esc(actionName(a))}${idArg ? `<span class="k"> · </span>${esc(idArg[1])}` : ""}</span></div>`;
  }
  const verdicts = violations.map(p => `<p class="flow-note err">${icon("warn")}<span><b>${esc(p.rule_id || "violation")}</b> ${esc(p.message || "")}</span></p>`).join("");
  return `<section class="panel flow-panel">${head}<div class="flow">${source}${plain}${encoding}${cut}${sink}</div>${verdicts}<p class="flow-note">${esc(watch)}</p></section>`;
}

/* ---------- legend ---------- */

function renderLegend() {
  const decisions = DECISIONS.map(d => `<span class="lg d-${d}">${GLYPH[d]}<span class="lg-word">${d.toUpperCase()}</span></span>`).join("");
  const trust = TRUST_ORDER.map(l => `<span class="lg"><span class="lg-sw ${tlClass(l)}${isTrusted(l) ? "" : " foreign"}"></span><span class="lg-t">${esc(l.replaceAll("_", " "))}</span></span>`).join("");
  $("legend").innerHTML = `${decisions}<span class="vrule"></span>${trust}`;
}

/* ---------- interaction ---------- */

function select(stepId) {
  if (stepId === null || stepId === undefined || !stepById(stepId)) return;
  state.stepId = stepId;
  state.quietOpen = false;
  writeHash();
  renderWork();
  revealSelection();
}
function moveStep(delta) {
  if (!state.view) return;
  const ids = state.view.steps.map(s => s.step_id);
  const at = ids.indexOf(state.stepId);
  select(ids[Math.max(0, Math.min(ids.length - 1, (at < 0 ? 0 : at + delta)))]);
}
function firstIntervention() {
  const hit = state.view?.steps.find(s => s.decision && s.decision.decision !== "allow");
  if (hit) select(hit.step_id);
}
function moveRun(delta) {
  const list = orderedRuns();
  if (!list.length) return;
  const at = list.findIndex(r => r.id === state.runId);
  const next = list[Math.max(0, Math.min(list.length - 1, at < 0 ? 0 : at + delta))];
  if (next && next.id !== state.runId) openRun(next.id);
}
function togglePresent() {
  const on = document.documentElement.classList.toggle("present");
  prefs.set("present", on);
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has("present")) { p.set("present", on ? "1" : "0"); history.replaceState(null, "", "#" + p.toString()); }
  renderTop();
  revealSelection();
}
function toggleLegend() {
  const hidden = document.documentElement.classList.toggle("no-legend");
  prefs.set("legend", !hidden);
}

$("mode").addEventListener("click", togglePresent);
$("runs").addEventListener("click", (e) => {
  const button = e.target.closest("[data-id]");
  if (button) openRun(button.dataset.id);
});
$("filter").addEventListener("input", (e) => { state.filter = e.target.value; renderRail(); });
$("stage").addEventListener("click", (e) => {
  const step = e.target.closest("[data-step]");
  if (step) { select(Number(step.dataset.step)); return; }
  if (e.target.closest("[data-quiet]")) {
    state.quietOpen = !state.quietOpen;
    const panel = $("inspector");
    const keep = panel.scrollTop;
    panel.innerHTML = inspectorHtml();
    panel.scrollTop = keep;
  }
});

/* Keyboard first: a recorded demo should not depend on steady mouse work. */
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input, textarea, select")) {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.key) {
    case "j": case "J": case "ArrowDown": moveStep(1); break;
    case "k": case "K": case "ArrowUp": moveStep(-1); break;
    case "b": case "B": firstIntervention(); break;
    case "[": moveRun(-1); break;
    case "]": moveRun(1); break;
    case "?": toggleLegend(); break;
    case "p": case "P": togglePresent(); break;
    case "/":
      if (document.documentElement.classList.contains("present")) return;
      $("filter").focus();
      break;
    default: return;
  }
  e.preventDefault();
});

window.addEventListener("hashchange", () => {
  const h = readHash();
  if (h.run && h.run !== state.runId && state.runs.some(r => r.id === h.run)) openRun(h.run, h.step);
  else if (h.step !== null && h.step !== state.stepId && state.view) select(h.step);
});

/* ---------- start ---------- */

// #present=1 in the URL forces presentation mode, so a recording setup can be bookmarked.
const presentParam = new URLSearchParams(location.hash.slice(1)).get("present");
document.documentElement.classList.toggle("present", presentParam === null ? prefs.get("present", false) : presentParam === "1");
document.documentElement.classList.toggle("no-legend", !prefs.get("legend", true));
renderLegend();
renderTop();
renderStage();
loadConfig().then(() => loadRuns(true));
setInterval(() => { if (document.visibilityState === "visible") loadRuns(false); }, POLL_MS);
</script>
</body>
</html>
