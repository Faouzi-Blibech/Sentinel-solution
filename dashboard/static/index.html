<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARIS trace viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%2312161d%27/%3E%3Crect x=%274%27 y=%274%27 width=%278%27 height=%278%27 rx=%271%27 fill=%27%234fb286%27/%3E%3C/svg%3E">
<style>
/* Fully offline: no web fonts, no CDN. The stacks resolve natively on the Windows demo machine.
   Sizes are rem against an 18px root in presentation mode (the 1920x1080 recording frame)
   and a 15px root otherwise, so one set of values serves both. */
:root {
  --ground: #12161d;
  --surface: #1a2029;
  --raised: #222a35;
  --rule: #2e3846;
  --rule-soft: #232b36;
  --ink: #e6eaf0;
  --ink-dim: #a3b0c1;
  --ink-faint: #8b99ac;
  --on-color: #0f1319;

  /* Decision: categorical. The -ink variants are the text-safe tints of the same hue. */
  --allow: #4fb286;    --allow-ink: #5cc79a;
  --block: #e05260;    --block-ink: #f2707c;
  --escalate: #e8a33d; --escalate-ink: #e8a33d;
  --rewrite: #5b9dd9;  --rewrite-ink: #72b0e8;

  /* Trust: ordinal, most to least trusted. Cool means settled, warm means foreign. */
  --t-system_policy: #5e7a8c;
  --t-authenticated_user: #6e8fa3;
  --t-trusted_internal: #8aa6b8;
  --t-untrusted_internal: #c2a15c;
  --t-untrusted_external: #cf7a3c;
  --t-adversary_controlled: #c2405f;

  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}

html { font-size: 15px; }
html.present { font-size: 18px; }
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--rewrite-ink); outline-offset: 2px; }
code, .mono { font-family: var(--mono); }
b { font-weight: 700; }

.label {
  font-size: .7333rem;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-faint);
  line-height: 1.2;
}
.label.lg { font-size: .8rem; color: var(--ink-dim); }
.calm { margin: 0; color: var(--ink-dim); font-size: .9rem; line-height: 1.45; text-wrap: pretty; }
.calm code { font-size: .8333rem; background: var(--raised); padding: 1px 5px; border-radius: 3px; color: var(--ink); }
.k { color: var(--ink-faint); }
.v { color: var(--ink-dim); }
.ok { color: var(--allow-ink); }
.err { color: var(--block-ink); }

/* ---------- semantic classes ---------- */

.d-allow    { --dc: var(--allow);    --dci: var(--allow-ink); }
.d-block    { --dc: var(--block);    --dci: var(--block-ink); }
.d-escalate { --dc: var(--escalate); --dci: var(--escalate-ink); }
.d-rewrite  { --dc: var(--rewrite);  --dci: var(--rewrite-ink); }
.d-none     { --dc: var(--ink-faint); --dci: var(--ink-dim); }

/* Untrusted material is visually foreign, not merely a different colour: every untrusted
   level carries a hatch, and adversary-controlled content is cross-hatched. A component
   sets --ha (hatch strength) on the same element that carries the level class. */
.tl { --tc: var(--t-trusted_internal); --hatch: none; }
.tl-system_policy      { --tc: var(--t-system_policy); }
.tl-authenticated_user { --tc: var(--t-authenticated_user); }
.tl-trusted_internal   { --tc: var(--t-trusted_internal); }
.tl-untrusted_internal {
  --tc: var(--t-untrusted_internal);
  --hatch: repeating-linear-gradient(135deg, transparent 0 9px, color-mix(in srgb, var(--tc) var(--ha, 24%), transparent) 9px 12px);
}
.tl-untrusted_external {
  --tc: var(--t-untrusted_external);
  --hatch: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--tc) var(--ha, 24%), transparent) 6px 10px);
}
.tl-adversary_controlled {
  --tc: var(--t-adversary_controlled);
  --hatch:
    repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--tc) var(--ha, 24%), transparent) 5px 8px),
    repeating-linear-gradient(45deg, transparent 0 5px, color-mix(in srgb, var(--tc) var(--ha, 24%), transparent) 5px 8px);
}

.glyph { width: 1.1111rem; height: 1.1111rem; flex: none; display: block; }
.ico {
  width: .8889rem; height: .8889rem; flex: none; display: block;
  fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
}

kbd {
  font-family: var(--mono);
  font-size: .7333rem;
  border: 1px solid var(--rule);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 1px 6px;
  color: var(--ink);
  background: var(--raised);
  line-height: 1.3;
}

.tchip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 1px 7px; border-radius: 3px;
  border: 1px solid var(--tc);
  background: color-mix(in srgb, var(--tc) 14%, transparent);
  font-family: var(--mono); font-size: .7333rem; color: var(--ink);
  white-space: nowrap; line-height: 1.35;
}
.tchip.foreign { --ha: 36%; border-width: 1.5px; background-color: color-mix(in srgb, var(--tc) 18%, transparent); background-image: var(--hatch); }
.tchip.quiet { background: transparent; border-color: var(--rule); color: var(--ink-dim); }
.tchip .sw { width: .5333rem; height: .5333rem; border-radius: 2px; background: var(--tc); flex: none; }
.tchip.quiet .sw { width: .6rem; height: .6rem; }
.tchip .src { color: var(--ink-dim); }

.tmark {
  --ha: 52%;
  flex: none; display: inline-block;
  width: .7333rem; height: .7333rem; border-radius: 2px;
  border: 1.5px solid var(--tc);
  background-color: color-mix(in srgb, var(--tc) 30%, transparent);
  background-image: var(--hatch);
}
.tmark.big { width: .8rem; height: .8rem; }

.sens {
  font-size: .7rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 3px; border: 1px solid var(--rule); color: var(--ink-dim);
  white-space: nowrap; line-height: 1.35;
}
.sens.restricted { border-color: var(--ink); color: var(--ink); }
.sens.confidential { border-color: color-mix(in srgb, var(--ink) 45%, var(--rule)); color: var(--ink); }

mark.taint {
  background: color-mix(in srgb, var(--escalate) 26%, transparent);
  color: var(--ink); box-shadow: inset 0 -2px 0 var(--escalate); border-radius: 2px; padding: 0 2px;
}
mark.dest {
  background: color-mix(in srgb, var(--block) 18%, transparent);
  color: var(--ink); box-shadow: inset 0 -2px 0 var(--block); border-radius: 2px; padding: 0 2px;
}
del.rm {
  background: color-mix(in srgb, var(--block) 26%, transparent);
  box-shadow: inset 0 -2px 0 var(--block); border-radius: 2px; padding: 0 2px; color: var(--ink);
  text-decoration: line-through; text-decoration-thickness: 2px;
}
ins.add {
  background: color-mix(in srgb, var(--rewrite) 26%, transparent);
  box-shadow: inset 0 -2px 0 var(--rewrite); border-radius: 2px; padding: 0 2px; color: var(--ink);
  text-decoration: none;
}
.gap { color: var(--ink-faint); padding: 0 .2rem; }

/* ---------- shell ---------- */

.app { display: flex; flex-direction: column; height: 100vh; }

.topbar {
  display: flex; align-items: center; gap: 1.2rem;
  height: 2.9333rem; padding: 0 1.4667rem; flex: none;
  background: var(--surface); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: .6667rem; flex: none; }
.brand svg { width: 1.4667rem; height: 1.4667rem; flex: none; display: block; }
.brand b { font-size: 1.1333rem; font-weight: 700; letter-spacing: .02em; }
.brand span { color: var(--ink-dim); }
.vrule { width: 1px; height: 1.3333rem; background: var(--rule); flex: none; }
.run-id {
  font-family: var(--mono); font-size: .8667rem; color: var(--ink-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.keys { margin-left: auto; display: flex; align-items: center; gap: .6667rem; flex: none; }
.keyhints { display: flex; align-items: center; gap: .9333rem; margin-right: .6667rem; }
.key { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; color: var(--ink-dim); white-space: nowrap; }
.mode {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 8px; border-radius: 3px; border: 1px solid var(--rule); background: var(--raised);
  color: var(--ink); font-size: .8rem; font-weight: 600; letter-spacing: .04em; line-height: 1.25; white-space: nowrap;
}
.mode:hover { border-color: var(--ink-faint); }
/* The console link borrows .mode's chrome; as an <a> it needs the text bits back. */
a.mode { text-decoration: none; display: inline-flex; align-items: center; }

.main { flex: 1; min-height: 0; display: flex; }
.stage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

/* ---------- run rail (hidden while presenting) ---------- */

.rail {
  width: 18.6667rem; flex: none; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--surface); border-right: 1px solid var(--rule);
}
html.present .rail { display: none; }
.rail-head { padding: .8rem 1rem .6667rem; display: flex; flex-direction: column; gap: .5333rem; border-bottom: 1px solid var(--rule-soft); }
.rail-title { display: flex; justify-content: space-between; align-items: baseline; }
.rail-count { font-size: .8rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.filter {
  width: 100%; font: inherit; font-size: .8667rem; color: var(--ink);
  background: var(--ground); border: 1px solid var(--rule); border-radius: 4px; padding: .3333rem .5333rem;
}
.filter::placeholder { color: var(--ink-faint); }
.runs { flex: 1; min-height: 0; overflow-y: auto; padding: 0 .5333rem 1.3333rem; margin: 0; list-style: none; }
.group-head {
  position: sticky; top: 0; z-index: 1; background: var(--surface);
  display: flex; justify-content: space-between; align-items: center; gap: .5rem;
  padding: .7333rem .4rem .3333rem;
}
.group-head .label { color: var(--ink-dim); display: inline-flex; align-items: center; gap: .4rem; }
.group-head .label .ico { color: var(--t-trusted_internal); }
.run {
  display: flex; flex-direction: column; gap: .1333rem; width: 100%;
  padding: .4667rem .6667rem; border-radius: 5px;
}
.run:hover { background: color-mix(in srgb, var(--raised) 60%, transparent); }
.run[aria-current="true"] { background: var(--raised); box-shadow: inset 0 0 0 1.5px var(--ink); }
.run-top { display: flex; align-items: center; gap: .4667rem; min-width: 0; }
.run-name { font-family: var(--mono); font-size: .8333rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-meta { display: flex; align-items: center; gap: .4667rem; font-size: .7333rem; color: var(--ink-faint); padding-left: .9333rem; min-width: 0; }
.run-meta .kind { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.run-meta .kind.k-attack { color: var(--ink); }
.run-meta .kind.k-hard_negative { color: var(--allow-ink); }
.breach { color: var(--block-ink); font-weight: 700; }
.mini { margin-left: auto; display: flex; gap: .4rem; font-variant-numeric: tabular-nums; }
.mini span { display: inline-flex; align-items: center; gap: 3px; color: var(--dci); }
.mini .glyph { width: .7333rem; height: .7333rem; }
.dot { width: .4667rem; height: .4667rem; border-radius: 50%; flex: none; background: var(--ink-faint); }
.dot.ok { background: var(--allow); }
.dot.no { background: var(--block); }
.rail-foot { padding: .5333rem 1rem; border-top: 1px solid var(--rule-soft); font-size: .7333rem; color: var(--ink-faint); }

/* ---------- run header ---------- */

.runhead {
  display: flex; align-items: center; justify-content: space-between; gap: 1.6rem;
  padding: .8rem 1.4667rem; flex: none; border-bottom: 1px solid var(--rule);
}
.runhead-l { display: flex; flex-direction: column; gap: .5333rem; min-width: 0; }
.badges { display: flex; align-items: center; gap: .6667rem; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 8px; border-radius: 3px; border: 1px solid var(--rule);
  color: var(--ink-dim); font-size: .7333rem; font-weight: 600; letter-spacing: .1em;
  line-height: 1.25; white-space: nowrap; text-transform: uppercase;
}
.badge .ico { width: .7222rem; height: .7222rem; stroke-width: 1.8; }
.badge.kind { font-size: .8rem; font-weight: 800; padding: 3px 9px; }
.badge.k-attack { background: var(--ink); border-color: var(--ink); color: var(--on-color); }
.badge.k-hard_negative { border-color: var(--allow); color: var(--allow-ink); }
.badge.k-benign { color: var(--ink); }
.badge.family { font-family: var(--mono); text-transform: none; letter-spacing: 0; font-weight: 500; }
.badge.defense { background: var(--raised); color: var(--ink); font-size: .8rem; font-weight: 700; letter-spacing: .08em; padding: 3px 9px; text-transform: none; }
.badge.defense .ico { width: .7778rem; height: .7778rem; color: var(--t-trusted_internal); stroke-width: 1.6; }
.badge.defense.baseline { background: transparent; color: var(--ink-dim); }
.badge.warn { border-color: var(--escalate); color: var(--escalate-ink); }
.scenario {
  font-family: var(--mono); font-size: 1.4rem; font-weight: 700; line-height: 1.15; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stats { display: flex; align-items: stretch; flex: none; }
.stat { display: flex; flex-direction: column; gap: .4rem; padding: 0 1.4667rem; border-left: 1px solid var(--rule); min-width: 6.6667rem; }
.stat.wide { min-width: 10rem; }
.stat.mid { min-width: 8rem; }
.stat-v {
  display: inline-flex; align-items: center; gap: .6667rem;
  font-size: 1.6rem; font-weight: 700; line-height: 1; color: var(--ink);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.stat-v .ico { width: 1.7rem; height: 1.7rem; stroke-width: 1.7; }
.stat-v.good { color: var(--allow-ink); }
.stat-v.bad { color: var(--block-ink); }
.stat-v .ico.good { color: var(--allow-ink); stroke-width: 2; width: 1.5556rem; height: 1.5556rem; }
.stat-v .ico.bad { color: var(--block-ink); }

/* ---------- step strip ---------- */

.strip {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(8.5rem, 1fr); gap: .4rem;
  padding: .6667rem 1.4667rem; flex: none; border-bottom: 1px solid var(--rule); overflow-x: auto;
}
.cell {
  display: flex; flex-direction: column; gap: .2667rem;
  padding: .4667rem .6667rem; border-radius: 5px; min-width: 0;
  box-shadow: inset 0 0 0 1px var(--rule); background: var(--surface);
}
.cell:hover { background: color-mix(in srgb, var(--raised) 70%, var(--surface)); }
.cell[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--ink); background: var(--raised); }
.cell-top { display: flex; align-items: center; gap: .4667rem; min-width: 0; }
.cell-word { font-size: .8rem; font-weight: 800; letter-spacing: .08em; color: var(--dci); }
.cell-id { margin-left: auto; display: flex; align-items: center; gap: .4rem; font-family: var(--mono); font-size: .8rem; color: var(--ink-faint); }
.cell-tool { font-family: var(--mono); font-size: .8333rem; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell[aria-current="true"] .cell-tool { color: var(--ink); }
.cell-bar { height: .2667rem; border-radius: 2px; background: var(--rule-soft); overflow: hidden; margin-top: .2rem; }
.cell-bar.empty { background: transparent; }
.cell-bar i { display: block; height: 100%; background: var(--dc); }

/* ---------- work area ---------- */

.work { flex: 1; min-height: 0; display: flex; }

.spine {
  width: min(37.3333rem, 42%); flex: none; overflow-y: auto; position: relative;
  background: var(--surface); border-right: 1px solid var(--rule);
}
.spine::after {
  content: ""; display: block; position: sticky; bottom: 0; height: 2.9333rem; margin-top: -2.9333rem;
  background: linear-gradient(to bottom, transparent, var(--surface)); pointer-events: none;
}
.goal { padding: .8rem 1.4667rem; border-bottom: 1px solid var(--rule-soft); display: flex; flex-direction: column; gap: .4667rem; }
.goal-head { display: flex; align-items: center; gap: .6667rem; flex-wrap: wrap; }
.goal p { margin: 0; font-size: 1.1rem; line-height: 1.38; text-wrap: pretty; }
.goal-turn { display: flex; flex-direction: column; gap: .2rem; }

.rows { list-style: none; margin: 0; padding: .2667rem 0 3rem; }
.row {
  display: grid; grid-template-columns: 2.1333rem 1.3333rem minmax(0, 1fr) 6.1333rem;
  align-items: center; gap: .8rem;
  width: calc(100% - 1.8667rem); margin: 0 .9333rem; padding: .3333rem .5333rem;
  border-radius: 5px; border-top: 1px solid var(--rule-soft);
}
.rows > li:first-child .row { border-top-color: transparent; }
.row:hover { background: color-mix(in srgb, var(--raised) 55%, transparent); }
.row[aria-current="true"] { background: var(--raised); box-shadow: inset 0 0 0 1.5px var(--ink); border-top-color: transparent; }
.row .glyph { width: 1.1667rem; height: 1.1667rem; }
.row-id { font-family: var(--mono); font-size: .8333rem; color: var(--ink-faint); }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-what { display: flex; align-items: baseline; gap: .4444rem; min-width: 0; }
.row-word { font-size: 1rem; font-weight: 800; letter-spacing: .06em; color: var(--dci); flex: none; }
.row-tool { font-family: var(--mono); font-size: .9333rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-tool.dim { color: var(--ink-dim); }
.row-codes { font-family: var(--mono); font-size: .7667rem; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-right { display: flex; align-items: center; justify-content: flex-end; gap: .5333rem; }
.risk-mini { display: flex; flex-direction: column; align-items: flex-end; gap: .2667rem; }
.risk-mini b { font-family: var(--mono); font-weight: 400; font-size: .8667rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.row[aria-current="true"] .risk-mini b { color: var(--ink); }
.risk-mini span { width: 4.2667rem; height: 6px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.risk-mini i { display: block; height: 100%; background: var(--dc); }

/* The selected step's events, threaded under its row. */
.thread { margin: 0 1.4667rem .6667rem 4.4rem; border-left: 1.5px solid var(--rule); }
.ev {
  position: relative; display: flex; flex-direction: column; gap: .3333rem;
  margin: .4rem 0 .4rem 1.3333rem; padding: .5333rem .8rem .6rem 1.4667rem;
  border-radius: 5px; border: 1px solid var(--rule-soft); background: var(--surface);
}
.ev.foreign {
  --ha: 24%;
  background-color: color-mix(in srgb, var(--tc) 12%, transparent);
  background-image: var(--hatch);
  border-color: color-mix(in srgb, var(--tc) 55%, transparent);
}
.ev.proposed { border-color: color-mix(in srgb, var(--dc) 60%, transparent); background: color-mix(in srgb, var(--dc) 7%, var(--surface)); }
.ev.violation { border-color: color-mix(in srgb, var(--block) 70%, transparent); background: color-mix(in srgb, var(--block) 10%, var(--surface)); }
.ev-ico {
  position: absolute; left: -.8667rem; top: .5333rem;
  width: 1.7333rem; height: 1.7333rem; border-radius: 50%;
  background: var(--ground); border: 1.5px solid var(--rule);
  display: flex; align-items: center; justify-content: center; color: var(--ink-dim);
}
.ev-ico .ico { width: 1rem; height: 1rem; }
.ev.foreign .ev-ico { border-color: color-mix(in srgb, var(--tc) 70%, transparent); color: var(--tc); }
.ev.proposed .ev-ico { border-color: color-mix(in srgb, var(--dc) 70%, transparent); color: var(--dci); }
.ev.violation .ev-ico { border-color: var(--block); color: var(--block-ink); }
.ev.outcome-ok .ev-ico { border-color: color-mix(in srgb, var(--allow) 70%, transparent); color: var(--allow-ink); }
.ev.outcome-no .ev-ico { border-color: color-mix(in srgb, var(--block) 70%, transparent); color: var(--block-ink); }
.ev-head { display: flex; align-items: center; gap: .6667rem; flex-wrap: wrap; }
.ev-type { font-size: .7333rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim); }
.ev.foreign .ev-type { color: var(--tc); }
.ev.proposed .ev-type { color: var(--dci); }
.ev.violation .ev-type { color: var(--block-ink); }
.ev-actor { font-family: var(--mono); font-size: .7667rem; color: var(--ink-faint); }
.ev-chips { margin-left: auto; display: flex; gap: .4rem; flex-wrap: wrap; }
.ev-body { font-family: var(--mono); font-size: .8667rem; line-height: 1.55; overflow-wrap: anywhere; }
.ev-body.prose { font-family: var(--sans); font-size: .9333rem; }
.ev-note { margin-top: .2rem; font-size: .8rem; color: var(--ink-dim); }
details.more { margin-top: .2667rem; }

.frow { display: grid; grid-template-columns: minmax(2.9333rem, max-content) minmax(0, 1fr); gap: .5333rem; padding: .1333rem 0; }
.fkey { font-family: var(--mono); font-size: .8667rem; color: var(--ink-faint); }

.ladder { display: flex; flex-direction: column; gap: .2667rem; }

.srcs { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; min-width: 0; }
.src {

}

.src b { font-size: .8667rem; font-weight: 600; overflow-wrap: break-word; min-width: 0; }

.flow { display: flex; flex-direction: column; }
.fnode {
  display: flex; flex-direction: column; gap: .2rem; min-width: 0;
  padding: .5333rem .8rem; border-radius: 5px; border: 1.5px solid var(--rule); background: var(--raised);
}
.fnode.secret { border-color: color-mix(in srgb, var(--escalate) 65%, transparent); }

.fnode-head { display: flex; align-items: center; gap: .4667rem; color: var(--ink-dim); white-space: nowrap; min-width: 0; }
.fnode-head .ico { width: 1rem; height: 1rem; }
.fnode.secret .fnode-head .ico { color: var(--escalate); }
.fnode.sink-ext .fnode-head .ico { color: var(--block-ink); }

.fnode-val { font-family: var(--mono); font-size: .9rem; font-weight: 700; overflow-wrap: anywhere; }

.flink { position: relative; height: 1.6rem; }

.flink.pass { height: 3.2rem; }
.flink.pass .line { border-color: var(--allow); }
.flink.pass .tip { color: var(--allow); }
.flink .tip { position: absolute; left: 1.7333rem; bottom: 0; transform: translateX(-50%); width: .8rem; height: .6rem; display: block; color: var(--ink-faint); }
.flink.cut .tip { color: var(--dc); }
.flink.leak .tip { color: var(--block); }
.flink .x {
  position: absolute; left: 1.7333rem; top: 50%; transform: translate(-50%, -50%);
  width: 2rem; height: 2rem; border-radius: 50%; background: var(--dc); color: var(--on-color);
  display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 .2667rem var(--surface);
}
.flink .x .ico { width: 1.0556rem; height: 1.0556rem; stroke-width: 2.4; }
.flink .tag {
  position: absolute; left: 3.4667rem; top: 50%; transform: translateY(-50%);

}
.flink.pass .tag, .flink.leak .tag { left: 2.6667rem; }
.flink.leak .tag { border-color: var(--block); color: var(--block-ink); background: color-mix(in srgb, var(--block) 14%, transparent); }
.flow-note { margin: 0; font-size: .8rem; color: var(--ink-faint); }
.flow-note.err { display: flex; gap: .4rem; align-items: flex-start; color: var(--block-ink); line-height: 1.35; }

.dest-badge.ext { border-color: var(--block); color: var(--block-ink); }

/* ---------- legend ---------- */

.legend {
  display: flex; align-items: center; gap: .9333rem;
  height: 2.5333rem; padding: 0 1.4667rem; flex: none; overflow: hidden;
  background: var(--surface); border-top: 1px solid var(--rule);
}

.lg { display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap; }

.empty-stage { margin: auto; max-width: 42rem; padding: 2rem; display: flex; flex-direction: column; gap: .8rem; }
.empty-stage h2 { margin: 0; font-size: 1.2rem; font-weight: 700; }
.empty-stage ul { margin: 0; padding-left: 1.2rem; color: var(--ink-dim); font-family: var(--mono); font-size: .8333rem; }

/* ---------- narrower screens ---------- */

@container insp (max-width: 62rem) {
  .panels { flex: none; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .panel { overflow: visible; }
  .panel.flow-panel { grid-column: 1 / -1; border-top: 1px solid var(--rule-soft); }
  .verdict { gap: 1.4rem; flex-wrap: wrap; }
  .v-facts { flex-basis: 100%; }
}
@container insp (max-width: 42rem) {
  .panels { grid-template-columns: minmax(0, 1fr); }

}

}

<script>
"use strict";

const TRUST_ORDER = ["system_policy", "authenticated_user", "trusted_internal",
                     "untrusted_internal", "untrusted_external", "adversary_controlled"];
const TRUSTED = new Set(TRUST_ORDER.slice(0, 3));
const DECISIONS = ["allow", "block", "escalate", "rewrite"];
const POLL_MS = 5000;
// Each successive signal's increment is drawn a step lighter, so order reads without a key.
const SEG_MIX = [100, 72, 54, 42, 34, 28, 24, 20];
const KIND_LABEL = { attack: "Attack", hard_negative: "Hard negative", benign: "Benign" };
const ENCODING = {
  none: ["—", "no watched value found"],
  plain: ["plain text", "readable as-is"],
  url: ["url-encoded", "decoded before matching"],
  base64: ["base64", "decoded before matching"],
  hex: ["hex", "decoded before matching"],
  rot13: ["rot13", "decoded before matching"],
  reversed: ["reversed", "read backwards"],
};

const state = {
  thresholds: { escalate: null, block: null },
  runs: [], roots: [], rootsMissing: null, listError: null, runsSig: "",
  runId: null, runModified: null, view: null, viewError: null, stepId: null,
  filter: "", quietOpen: false,
};
let openToken = 0;

/* ---------- small helpers ---------- */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = (n) => String(n).padStart(2, "0");
const isNum = (v) => v !== null && v !== undefined && v !== "" && !Number.isNaN(Number(v));
const num = (v, d = 2) => isNum(v) ? Number(v).toFixed(d) : "—";
const clamp01 = (v) => Math.max(0, Math.min(1, Number(v) || 0));
const clip = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const str = (v) => v === undefined ? "" : typeof v === "string" ? v : JSON.stringify(v);
const trustRank = (l) => TRUST_ORDER.indexOf(l);

  get(key, fallback) {
    try { const v = localStorage.getItem("haris.viewer." + key); return v === null ? fallback : v === "1"; }
    catch { return fallback; }

  set(key, value) { try { localStorage.setItem("haris.viewer." + key, value ? "1" : "0"); } catch { /* private window */ } },

async function api(path) {
  const res = await fetch(path, { cache: "no-store" });
  let body = null;
  try { body = await res.json(); } catch { body = null; }
  if (!res.ok) throw new Error((body && body.detail) || `${res.status} ${res.statusText}`);
  return body;
}
