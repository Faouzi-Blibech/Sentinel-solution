<!DOCTYPE html>
<html lang="en" data-theme="haris">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARIS · trace viewer</title>
<style>
:root, [data-theme="haris"] {
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --bg: #12161d; --sf: #1a2029; --rs: #222a35; --rule: #2e3846; --rule2: #232b36;
  --ink: #e6eaf0; --dim: #a3b0c1; --faint: #8b99ac;
  --acc: #5b9dd9; --accT: #72b0e8; --accBg: rgba(91,157,217,.16); --dot: rgba(255,255,255,.06);
  --good: #5cc79a; --warn: #e8a33d; --bad: #f2707c;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body { color: var(--ink); font: 14px/1.45 var(--sans); }
button { white-space: nowrap; font-family: inherit; }
input::placeholder, textarea::placeholder { color: #8c8c9a; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
[hidden] { display: none !important; }

.app { display: flex; height: 100vh; min-height: 620px; overflow: hidden; background: var(--bg); }
.label { font: 600 11px/1 var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); } .faint { color: var(--faint); }
.btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--rs); color: var(--ink); font: 13px var(--sans); cursor: pointer; }
.btn:hover { border-color: var(--faint); }
.btn-acc { border-color: var(--acc); background: var(--accBg); font-weight: 600; }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--rule); background: var(--rs); color: var(--ink); cursor: pointer; font: 14px var(--mono); flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 11px/1 var(--mono); letter-spacing: .1em; border: 1px solid currentColor; border-radius: 6px; padding: 5px 7px; white-space: nowrap; }

/* ---------- sidebar ---------- */
.side { flex: none; background: var(--sf); border-right: 1px solid var(--rule); overflow: hidden; position: relative; z-index: 3;
        width: 288px; transition: width .34s var(--ease); }
.side.closed { width: 68px; }
.side-in { width: 288px; height: 100%; display: flex; flex-direction: column; }
.fade { transition: opacity .2s .12s; white-space: nowrap; min-width: 0; }
.side.closed .fade { opacity: 0; transition-delay: 0s; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 12px; padding: 18px 16px; }
.brand-mark { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--accBg); border: 1px solid var(--acc); display: grid; place-items: center; }
.brand-mark i { width: 13px; height: 13px; transform: rotate(45deg); border: 2px solid var(--accT); border-radius: 2px; }
.brand-name { font: 700 17px/1 var(--sans); letter-spacing: .14em; }
.brand-sub { font: 500 11px/1 var(--mono); letter-spacing: .16em; color: var(--faint); margin-top: 6px; }
.nav { display: flex; flex-direction: column; gap: 4px; padding: 6px 12px 14px; }
.nav-item { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; white-space: nowrap;
            color: var(--dim); border: 1px solid transparent; transition: background .15s; }
.nav-item:hover { background: var(--rs); }
.nav-item.on { color: var(--ink); background: var(--accBg); border-color: var(--acc); font-weight: 600; }
.nav-glyph { width: 20px; flex: none; text-align: center; font: 600 15px/1 var(--mono); }
.side-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.side.closed .side-body { opacity: 0; pointer-events: none; }
.side-body { transition: opacity .2s .12s; }
.defs { padding: 14px 16px 8px; border-top: 1px solid var(--rule2); }
.def-row { display: flex; flex-wrap: wrap; gap: 6px; }
.def-chip { font: 400 12px/1 var(--mono); padding: 7px 9px; border-radius: 7px; cursor: pointer; border: 1px solid var(--rule); background: var(--bg); color: var(--dim); }
.def-chip.on { font-weight: 600; border-color: var(--acc); background: var(--accBg); color: var(--ink); }
.variants-toggle { display: block; margin: 14px 0 8px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; }
.variants-toggle:hover { color: var(--dim); }
.def-note { font-size: 12px; color: var(--faint); margin-top: 8px; white-space: normal; }
.search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--rule); border-radius: 9px; padding: 0 10px; margin: 10px 16px; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--ink); font: 14px var(--sans); padding: 9px 0; }
.kbd { font: 600 11px/1 var(--mono); color: var(--faint); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; padding: 3px 5px; }
.runlist { flex: 1; min-height: 0; overflow: auto; padding: 4px 10px 14px; }
.group-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 8px 6px; }
.run-row { display: flex; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; }
.run-row:hover { background: var(--rs); }
.run-row.on { background: var(--rs); border-color: var(--acc); }
.run-name { font: 500 13px/1.35 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-meta { font-size: 12px; color: var(--faint); }
.side-foot { padding: 12px; border-top: 1px solid var(--rule2); }
.live { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--dim); padding: 0 4px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.live.off i { background: var(--bad); }

/* ---------- header ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hdr { display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 64px; border-bottom: 1px solid var(--rule); flex: none; }
.hdr-title { display: flex; flex-direction: column; min-width: 0; flex: 1 1 240px; }
.hdr-run { display: flex; align-items: center; gap: 10px; margin-top: 6px; min-width: 0; }
.hdr-name { font: 600 16px/1.2 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex: none; }
.keyhints { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--faint); }
.keyhints span { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
@media (max-width: 1360px) { .keyhints { display: none; } }
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- trace ---------- */
.trace-top { padding: 20px 24px 0; display: flex; flex-direction: column; gap: 12px; flex: none; }
.banner { display: flex; gap: 20px; align-items: flex-start; padding: 20px 24px; border-radius: 16px; border: 1px solid; flex-wrap: wrap; }
.banner-shape { position: relative; width: 44px; height: 44px; flex: none; }
.headline { font: 650 22px/1.25 var(--sans); text-wrap: pretty; }
.why { color: var(--dim); font-size: 14px; margin-top: 6px; max-width: 920px; text-wrap: pretty; }
.stats { display: grid; grid-template-columns: repeat(2, auto); gap: 14px 28px; flex: none; align-content: center; }
.stat-v { font: 700 22px/1.2 var(--sans); margin-top: 6px; }
.goal { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 2px; }
.goal-plan { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.tool-chip { font: 12px/1 var(--mono); color: var(--dim); background: var(--rs); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 7px; }
.legend { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 14px 24px 12px; border-bottom: 1px solid var(--rule2); flex: none; font-size: 13px; color: var(--dim); }
.legend > span { display: flex; align-items: center; gap: 7px; }
.hatch { width: 14px; height: 12px; border-radius: 2px; background: repeating-linear-gradient(135deg, #e8935a 0 2px, transparent 2px 4px); border: 1px solid #e8935a; }
.canvas { flex: 1; min-height: 0; position: relative; background-color: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; }
.graph-scroll { position: absolute; inset: 0; overflow: auto; transition: padding-right .34s var(--ease); }
.canvas.drawer-open .graph-scroll { padding-right: 560px; }
.graph { display: flex; flex-direction: column; align-items: center; padding: 28px 28px 60px; }
.step-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }
.connector { width: 2px; height: 22px; background: var(--rule); }
.step-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,440px) minmax(0,1fr); column-gap: 24px; align-items: center; width: 100%; max-width: 1200px; }
.canvas.drawer-open .step-row { grid-template-columns: 0 minmax(0,440px) 0; column-gap: 0; }
.canvas.drawer-open .ann-l, .canvas.drawer-open .ann-r { display: none; }
.ann-l-cell { display: flex; justify-content: flex-end; min-width: 0; overflow: hidden; }
.ann-l { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid; background: var(--sf); max-width: 300px; }
.ann-r-cell { min-width: 0; overflow: hidden; }
.ann-r { display: flex; align-items: center; gap: 10px; }
.ann-r-card { padding: 10px 14px; border-radius: 10px; border: 1px dashed; max-width: 320px; min-width: 0; }
.node { display: grid; grid-template-columns: 32px 22px minmax(0,1fr) 60px; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; cursor: pointer;
        background: var(--sf); border: 1px solid var(--rule); transition: box-shadow .18s, border-color .18s, background .18s; }
.node:hover { background: var(--rs); }
.node.sel { background: var(--rs); border-color: var(--acc) !important; box-shadow: 0 0 0 4px var(--accBg); }
.node-n { font: 600 12px/1 var(--mono); color: var(--faint); border: 1px solid var(--rule); border-radius: 7px; width: 32px; height: 28px; display: grid; place-items: center; }
.node-word { font: 700 12px/1 var(--mono); letter-spacing: .08em; flex: none; }
.node-tool { font: 500 14px/1.3 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node-title { font-size: 13px; color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node-inline { display: none; font: 12px/1.3 var(--mono); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.canvas.drawer-open .node-inline { display: block; }
.node-risk { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.riskbar { width: 56px; height: 4px; border-radius: 2px; background: var(--rule); }
.riskbar i { display: block; height: 100%; border-radius: 2px; }
.open-insp { position: absolute; right: 20px; top: 20px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--acc); background: var(--accBg); color: var(--ink); font: 600 13px var(--sans); cursor: pointer; }

/* ---------- inspector ---------- */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 560px; max-width: 100%; display: flex; flex-direction: column; background: var(--sf);
          border-left: 1px solid var(--rule); transform: translateX(102%); transition: transform .34s var(--ease); }
.drawer.open { transform: translateX(0); box-shadow: -24px 0 48px rgba(0,0,0,.35); }
.dr-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--rule2); }
.dr-top { display: flex; align-items: center; gap: 10px; }
.step-chip { font: 600 11px/1 var(--mono); letter-spacing: .12em; color: var(--dim); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 7px; }
.dr-title { font: 650 20px/1.25 var(--sans); text-wrap: pretty; overflow-wrap: anywhere; }
.dr-risk { font: 700 40px/1 var(--sans); }
.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--rule2); overflow-x: auto; flex: none; }
.tab { padding: 13px 12px 11px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--dim); font: 400 13px var(--sans); cursor: pointer; white-space: nowrap; }
.tab.on { border-bottom-color: var(--acc); color: var(--ink); font-weight: 600; }
.tab-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 7px; vertical-align: middle; }
.dr-body { flex: 1; min-height: 0; overflow: auto; padding: 20px 22px 28px; }
.card-dashed { border: 1px dashed var(--rule); border-radius: 12px; padding: 20px; color: var(--dim); text-wrap: pretty; }
.card-title { font: 650 16px var(--sans); color: var(--ink); }
.calm { display: flex; gap: 14px; align-items: center; border: 1px solid var(--rule); background: var(--rs); border-radius: 12px; padding: 18px; }
.rb { position: relative; height: 84px; margin: 0 4px; }
.rb-tick { position: absolute; top: 0; transform: translateX(-50%); text-align: center; font: 600 11px/1.25 var(--mono); }
.rb-track { position: absolute; left: 0; right: 0; top: 34px; height: 26px; border-radius: 6px; background: var(--rs); border: 1px solid var(--rule); overflow: hidden; display: flex; }
.rb-seg { border-right: 2px solid var(--bg); font: 700 12px/26px var(--mono); color: #0b0b0e; padding-left: 6px; overflow: hidden; }
.rb-line { position: absolute; top: 30px; height: 34px; width: 2px; }
.rb-marker { position: absolute; top: 62px; width: 40px; text-align: center; }
.rb-marker i { display: block; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid var(--ink); margin: 0 auto; }
.sig-row { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 12px; padding: 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--rs); }
.sig-badge { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font: 700 12px/1 var(--mono); color: #0b0b0e; }
.quiet-row { display: grid; grid-template-columns: minmax(0,210px) minmax(0,1fr); gap: 12px; font-size: 13px; }
.rung { display: grid; grid-template-columns: minmax(0,200px) minmax(0,1fr); gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule2); }
.swatch { width: 16px; height: 16px; flex: none; border-radius: 3px; }
.src-chip { display: inline-flex; align-items: center; gap: 6px; font: 12.5px/1 var(--mono); padding: 6px 8px; border-radius: 7px; border: 1px solid; }
.boundary { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.boundary b { font: 700 11px/1 var(--mono); letter-spacing: .12em; }
.boundary i { flex: 1; border-top: 2px dashed var(--dim); }
.diff-card { border-radius: 12px; padding: 16px; border: 1px solid; }
.diff-text { font: 14px/1.6 var(--mono); margin-top: 10px; overflow-wrap: anywhere; }
.flow-card { border: 1px solid var(--rule); background: var(--rs); border-radius: 12px; padding: 14px 16px; }
.flow-stem { width: 2px; height: 20px; background: var(--rule); margin: 0 auto; }
.pill { align-self: center; border: 1px solid var(--rule); border-radius: 999px; padding: 7px 14px; font: 13px var(--mono); color: var(--dim); }
.raw { margin: 0; background: var(--bg); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; font: 12.5px/1.6 var(--mono); color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- pages ---------- */
.scroll-page { flex: 1; min-height: 0; overflow: auto; padding: 28px 28px 48px; }
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.wrap.narrow { max-width: 920px; gap: 18px; }
.page-title { font: 650 28px/1.2 var(--sans); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.panel { border: 1px solid var(--rule); background: var(--sf); border-radius: 14px; }
.kpi { padding: 18px 20px; }
.kpi-v { font: 700 34px/1.1 var(--sans); margin-top: 10px; }
.table-h, .table-r { display: grid; grid-template-columns: minmax(0,2.2fr) 130px minmax(0,1.4fr) minmax(0,1.3fr) 80px; gap: 16px; padding: 12px 20px; align-items: center; }
.table-h { border-bottom: 1px solid var(--rule); }
.table-r { padding: 13px 20px; border-bottom: 1px solid var(--rule2); cursor: pointer; }
.table-r:hover { background: var(--rs); }
.pips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pip-count { display: inline-flex; align-items: center; gap: 4px; font: 600 12px/1 var(--mono); color: var(--dim); }
.cmp-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.cmp-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-width: 0; }
.cmp-name { font: 650 16px var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-card { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 14px; cursor: pointer; background: var(--sf); border: 1px solid var(--rule); min-height: 230px; }
.cmp-card:hover { border-color: var(--faint); }
.cmp-card.ours { background: var(--rs); border: 2px solid var(--acc); }
.cmp-card.missing { cursor: default; opacity: .6; border-style: dashed; }
.suite-row { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 18px; align-items: center; }
.bar-track { flex: 1; background: var(--rs); overflow: hidden; }
.step-card { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 16px; padding: 20px; }
.num { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--acc); background: var(--accBg); display: grid; place-items: center; font: 700 15px var(--mono); color: var(--accT); }
.code { margin: 12px 0 0; background: var(--bg); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; font: 13px/1.6 var(--mono); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.status-ok { display: flex; align-items: center; gap: 12px; border: 1px solid rgba(92,199,154,.5); background: rgba(92,199,154,.07); border-radius: 14px; padding: 16px 20px; }
.console { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .console { grid-template-columns: minmax(0,1fr); } }
.console .panel { padding: 18px 20px 22px; min-width: 0; }
.field-l { display: block; font-size: 12px; color: var(--faint); margin: 14px 0 6px; }
.field { width: 100%; min-width: 0; display: block; background: var(--bg); border: 1px solid var(--rule); color: var(--ink); border-radius: 8px; padding: 9px 11px; font: 13px/1.5 var(--mono); }
textarea.field { resize: vertical; }
.presets { display: flex; flex-wrap: wrap; gap: 7px; }
.row2 { display: flex; gap: 10px; } .row2 > * { flex: 1; min-width: 0; }
.empty { max-width: 720px; margin: 60px auto; }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="hdr" id="hdr"></header>
    <div class="page" id="page"></div>
  </main>
</div>

<script>
"use strict";
/*
 * HARIS trace viewer. Vanilla JS, one file, no build step.
 *
 * Everything shown comes from the viewer's own API (`api/runs`, `api/run`, `api/guard`).
 * The design prototype this implements used mock data; where the mock showed something the
 * real journal does not record (an intended plan, the prototype's four timing stages, a
 * suite-wide median latency), this page shows what is actually recorded instead, rather
 * than inventing it.
 *
 * Rendering never assigns data to innerHTML. Agent output, tool arguments and payloads are
 * untrusted by construction -- this viewer exists to display attacks -- so every value goes
 * through textContent via h().
 */

// ------------------------------------------------------------------ vocabulary
const DEC = {
  ALLOW:    { c: "#5cc79a", g: "✓", w: "ALLOW" },
  BLOCK:    { c: "#f2707c", g: "✕", w: "BLOCK" },
  ESCALATE: { c: "#e8a33d", g: "!", w: "ESCALATE" },
  REWRITE:  { c: "#72b0e8", g: "⇄", w: "REWRITE" },
  NONE:     { c: "#8c8c9a", g: "",  w: "TASK" },
};
const LV = [
  { k: "system_policy",        c: "#c9d2de", bg: "#c9d2de" },
  { k: "authenticated_user",   c: "#a3b7cc", bg: "#a3b7cc" },
  { k: "trusted_internal",     c: "#8298ae", bg: "#8298ae" },
  { k: "untrusted_internal",   c: "#d4b36e", bg: "repeating-linear-gradient(135deg,#d4b36e 0 2px,transparent 2px 6px)" },
  { k: "untrusted_external",   c: "#e8935a", bg: "repeating-linear-gradient(135deg,#e8935a 0 2px,transparent 2px 4px)" },
  { k: "adversary_controlled", c: "#f2707c", bg: "repeating-linear-gradient(45deg,#f2707c 0 1.5px,transparent 1.5px 4px),repeating-linear-gradient(135deg,#f2707c 0 1.5px,transparent 1.5px 4px)" },
];
const TRUST_INDEX = Object.fromEntries(LV.map((l, i) => [l.k, i]));
const KIND = { attack: { l: "ATTACK", c: "#f2707c" }, hn: { l: "HARD NEGATIVE", c: "#e8a33d" }, benign: { l: "BENIGN", c: "#a8a8b6" } };
const TONE = { good: "#5cc79a", warn: "#e8a33d", bad: "#f2707c" };
const SEG = ["#5b9dd9", "#72b0e8", "#e8a33d", "#5cc79a"];
const STAGE_COLOURS = ["#5b9dd9", "#72b0e8", "#e8a33d", "#5cc79a", "#a3b7cc"];

// HARIS reaches the corpus three ways: the kit's own scorer (http_defense) and our red-team
// ladder against its adaptive and shipped attackers. One scenario can have all three, so a
// fixed preference picks one per scenario instead of listing the same attack three times.

    else if (type === "memory_write") title = "Write to memory · " + short(action.content || argSummary(action.arguments), 60);
    else if (type === "request_confirmation") title = "Ask a human to confirm";

function renderPageOnly(resetForm) {
  const page = document.getElementById("page");
  if (resetForm) ["g-goal", "g-proposed", "g-source", "g-trust", "g-sens"].forEach(id => { const el = document.getElementById(id); if (el) el.remove(); });
  const keepScroll = page.querySelector(".graph-scroll");
  const top = keepScroll ? keepScroll.scrollTop : 0;
  let kids;
  if (S.page === "overview") kids = renderOverview();
  else if (S.page === "compare") kids = renderCompare();
  else if (S.page === "connect") kids = renderConnect();
  else kids = renderTrace();
  page.replaceChildren(...[kids].flat(Infinity).filter(Boolean));
  const again = page.querySelector(".graph-scroll");
  if (again) again.scrollTop = top;
}
function render() {
  const focused = document.activeElement && document.activeElement.id === "q";
  const caret = focused ? document.activeElement.selectionStart : null;
  renderSide(); renderHeader(); renderPageOnly();
  if (focused) { const q = document.getElementById("q"); q.focus(); if (caret != null) q.setSelectionRange(caret, caret); }
}

// ------------------------------------------------------------------ keyboard
window.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) {
    if (e.key === "Escape" && t.id === "q") { S.q = ""; t.blur(); render(); }
    else if (e.key === "Escape") t.blur();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === "j" || k === "J" || k === "ArrowDown") { e.preventDefault(); pickStep(S.step + 1); }
  else if (k === "k" || k === "K" || k === "ArrowUp") { e.preventDefault(); pickStep(S.step - 1); }
  else if (k === "b" || k === "B") { if (S.run && S.run.iv >= 0) pickStep(S.run.iv); }
  else if (k === "]") moveRun(1);
  else if (k === "[") moveRun(-1);
  else if (k === "Escape") { S.drawer = false; render(); }
  else if (k === "/") { e.preventDefault(); const q = document.getElementById("q"); if (q) q.focus(); }
  else if (k === "\\") { S.sideOpen = !S.sideOpen; render(); }
});

// ------------------------------------------------------------------ start
(async function start() {
  render();
  const m = /run=([^&]+)/.exec(location.hash);
  if (m) S.runId = null;
  await loadRuns(true);
  if (m) { const id = decodeURIComponent(m[1]); if (S.entries.some(e => e.id === id)) await openRun(id, { keepPage: S.page === "connect" }); }
  setInterval(() => { if (document.visibilityState === "visible") loadRuns(false); }, 5000);
})();
</script>
