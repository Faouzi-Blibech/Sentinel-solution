      customer_id: CU-9001
  - id: customer_9002
    action: tool_call
    tool: customer_lookup
    args:
      customer_id: CU-9002
  - id: customer_9003
    action: tool_call
    tool: customer_lookup
    args:
      customer_id: CU-9003
