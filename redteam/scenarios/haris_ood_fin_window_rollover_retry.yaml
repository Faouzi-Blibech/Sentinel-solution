    args:
      customer_id: CU-9001
  - id: customer_9002
    action: tool_call
    tool: customer_lookup
    args:
      customer_id: CU-9002
  - id: customer_9003
    action: tool_call
    tool: customer_lookup
    args:
      customer_id: CU-9003
  - id: doc_cd01
    action: tool_call
    tool: case_document_read
    args:
      case_id: CASE-7001
      doc_id: CD-01
  - id: doc_cd02
    action: tool_call
    tool: case_document_read
    args:
      case_id: CASE-7001
      doc_id: CD-02
  - id: doc_cd03
    action: tool_call
    tool: case_document_read
    args:
      case_id: CASE-7001
      doc_id: CD-03
  - id: doc_cd04
    action: tool_call
    tool: case_document_read
    args:
      case_id: CASE-7002
      doc_id: CD-04
  - id: doc_cd05
    action: tool_call
