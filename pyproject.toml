[project]
name = "haris"
version = "1.0.0"
description = "HARIS: provenance-anchored action gating for autonomous AI agents."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
