[project]
name = "haris"
version = "1.0.0"
description = "HARIS: provenance-anchored action gating for autonomous AI agents."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0.2",
]

# The contract types come from the organizers' kit, which is not on PyPI, so it cannot
# go in `dependencies` by name. It is installed explicitly in the Dockerfile and is
# present in the dev environment via `uv sync`. Leaving it undeclared entirely is what
# produced an image that escalated every action; `tests/test_readiness.py` now fails
# loudly instead of the service degrading in silence.
[project.optional-dependencies]
contract = ["sentinel-bench @ git+https://github.com/Skan22/Sentinel_Starter_Kit.git@dd2e5fe0979d0781a4bfe6d0849cd80cf69ef4a2"]

dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.hatch.metadata]
# The contract is a git reference, not a PyPI name; hatchling requires this opt-in.
allow-direct-references = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
